meta:
  contract: timing-runtime-v2
  version: 2.0
  status: canonical_not_runtime_activated
  decision: D-033
  health_values: ../../research/health/machine-readable/product_protocol.yaml
  product_fact_schema: ../../research/health/machine-readable/event_schema.json
  intended_purpose: >-
    A private general-wellness schedule for visual resets, movement opportunities,
    position variety, and optional recovery without claiming a health outcome.
  prohibited_inference: >-
    No input, idle, timer, camera, motion, companion, or model observation is a
    completion fact or proof of movement, visual relief, posture, or health benefit.

identities:
  clock_cycle_id:
    format: uuid
    scope: one_clock
    created_when:
      - clock_is_enabled_without_an_existing_cycle
      - a_fresh_cycle_effect_is_committed
      - a_user_approved_schedule_restart_is_committed
    stable_through:
      - accumulating
      - soft_due
      - heads_up
      - held
      - snoozed
      - running
      - relaunch
    rule: >-
      A merged opportunity carries each participating ClockCycleID. It never
      replaces them with a merged clock identity.
  opportunity_id:
    format: uuid
    scope: one_coordinated_offer
    created_when: arbiter_selects_one_or_more_due_clock_cycles
    stable_through:
      - every_projection_on_mac_iphone_and_watch
      - heads_up_and_break_surfaces
      - snooze_and_reoffer
      - relaunch_and_handoff
    closed_when: one_terminal_candidate_wins
  action_id:
    format: uuid
    scope: one_user_system_or_companion_action
    idempotency: duplicate_action_id_is_an_audited_no_op
    required_context:
      - opportunity_id_when_opportunity_scoped
      - participating_clock_cycle_ids
      - origin_device_id
      - origin_session_id
      - origin_revision
      - origin_phase
      - origin_segment_id_when_segmented
      - origin_device_counter
      - causal_parent_action_ids
  decision_id:
    format: uuid
    scope: one_automatic_hold_release_shift_merge_or_schedule_restart
    rule: >-
      A DecisionID belongs only to the scheduling-decision ledger and can never
      be substituted for an ActionID or a product completion fact.
  device_id:
    format: locally_generated_uuid
    lifetime: installation_until_local_reset
    privacy: never_vendor_or_account_identity
  session_id:
    format: uuid
    lifetime: one_process_run_or_companion_extension_session

time:
  wall_metadata:
    required:
      - recorded_at_utc
      - origin_time_zone_identifier
    deadline_records_also_require:
      - deadline_at_utc
      - anchor_recorded_at_utc
      - remaining_seconds_at_anchor
    purpose: display_exchange_and_audit_only_never_countdown_reconstruction
  local_monotonic_anchor:
    clock: continuous_monotonic
    required:
      - monotonic_epoch_id
      - anchor_ticks
      - remaining_seconds_at_anchor
    rule: >-
      Within a live monotonic epoch, elapsed duration and ordering use monotonic
      ticks. Wall-clock changes never add schedule-clock time.
  schedule_clock_restore:
    rule: >-
      Persist accumulated eligible seconds and phase. On restore, establish a new
      monotonic baseline at the first valid sample and add zero elapsed seconds for
      shutdown, sleep, an unavailable session, or an unobserved gap.
  accepted_ritual_deadline:
    rule: >-
      A running visual, movement, merged, or recovery segment has one coordinator-issued
      deadline ID and a continuous-monotonic deadline. Persist the boot/clock epoch,
      anchor ticks, selected duration, last known remaining duration, and opportunity
      revision. If the exact continuous epoch cannot be resumed, expire the segment;
      wall time never reconstructs or extends remaining duration. Sleep, lock, relaunch,
      callback suspension, and handoff therefore cannot extend the accepted duration.
    persisted_anchor_requires:
      - deadline_id
      - coordinator_device_id
      - monotonic_epoch_id
      - accepted_at_ticks
      - deadline_ticks
      - selected_duration_seconds
      - last_known_remaining_seconds
      - opportunity_revision
    same_epoch_restore: remaining_is_max_zero_deadline_ticks_minus_current_ticks
    epoch_or_anchor_discontinuity: remaining_is_zero_and_timer_finished_is_reconciled_once
    wall_clock_change: ignored_for_countdown
    handoff:
      authority_before_ack: sender_deadline_remains_authoritative
      acknowledgement_requires:
        - deadline_id_and_opportunity_revision
        - sender_epoch_and_send_ticks
        - receiver_epoch_and_receive_ticks
        - bounded_round_trip_uncertainty
        - final_sender_commit_ticks
      commit_rule: >-
        Transfer only after a bounded monotonic handshake. The receiving deadline uses
        the sender's remaining duration at final commit minus the full measured
        uncertainty bound. If the bound, epochs, revision, or acknowledgement is missing
        or stale, do not transfer; the sender remains authoritative. A negative result
        expires immediately. Wall clocks never choose remaining duration.
    on_return_after_deadline: timer_finished_once_and_quiet_receipt
    lifecycle_return_order:
      - reconcile_companion_terminal_candidates
      - resolve_local_absolute_deadline
      - apply_the_single_winning_terminal_effect_if_any
      - otherwise_resume_the_same_running_ritual
      - only_then_evaluate_schedule_clock_release_corridors
  observation_gap:
    expected_sample_seconds: 5
    maximum_covered_interval_seconds: 15
    rule: >-
      A non-finite, backward, or longer adjacent sample interval establishes a new
      baseline and accrues zero time. There is no catch-up.
  working_hours:
    evaluation: local_wall_calendar_boundary
    metadata: time_zone_identifier_and_resolved_next_boundary
    rule: >-
      Working-hour boundaries choose Paused versus eligible state. They never
      supply elapsed schedule time; monotonic samples inside an eligible window do.
  boundary_predicates:
    universal_deadline: elapsed_seconds_greater_than_or_equal_to_deadline_seconds
    recent_input_eligible: seconds_since_input_less_than_or_equal_to_60
    long_idle_begins: seconds_since_input_greater_than_or_equal_to_300
    valid_covered_sample: adjacent_interval_seconds_less_than_or_equal_to_15
    invalid_sample_gap: adjacent_interval_seconds_greater_than_15
    release_corridor_active: elapsed_seconds_less_than_corridor_seconds
    release_corridor_ends: elapsed_seconds_greater_than_or_equal_to_corridor_seconds
    snooze_active: elapsed_seconds_less_than_selected_snooze_seconds
    snooze_reoffers: elapsed_seconds_greater_than_or_equal_to_selected_snooze_seconds
    due_boundary: accumulated_eligible_seconds_greater_than_or_equal_to_configured_boundary
    rule: evaluate_each_edge_once_and_never_use_strict_greater_than_for_a_deadline

clock_contract:
  visual:
    meaning: visual_reset_schedule_based_on_estimated_active_computer_use
    permission_free_accrual: >-
      Awake, active, unlocked, inside enabled working hours, not manually paused,
      not in any accepted ritual, not in a qualified confirmed-away interval,
      and covered by adjacent valid samples. Input silence below long-idle onset
      remains eligible so passive reading is not treated as a visual reset. This is
      not a gaze, face-presence, viewing-distance, or near-screen estimate.
  movement:
    meaning: movement_opportunity_schedule_based_on_estimated_active_computer_use
    permission_free_accrual: >-
      The same system eligibility as visual plus recent input at or below 60 seconds.
      Input silence over 60 seconds freezes this schedule; it estimates neither body
      stillness nor movement and never proves either.
  position:
    meaning: optional_position_change_schedule_based_on_estimated_active_computer_use_or_user_interval
    permission_free_accrual: >-
      Optional/manual. When enabled without sensing, it accrues under visual
      eligibility, freezes during every accepted ritual, and stops at long-idle
      onset. It estimates no body position, stability, or posture score.
  recovery:
    meaning: optional_recovery_schedule_from_eligible_interaction_time_and_explicit_deferrals
    permission_free_accrual: >-
      Accrues only while movement timing is eligible after a movement deferral.
      It creates at most one optional recovery offer and is never a risk state.
  qualified_optional_assessment:
    rule: >-
      Near-screen, likely movement, likely away, or position assessments may exist only
      in a separately authorized capability. Every assessment carries source capability,
      provenance, observation time, expiry, qualification, confidence band, and a
      correction path. Missing, stale, conflicting, or unavailable evidence is unknown
      and cannot mutate a schedule unless an approved rule explicitly accepts unknown.

presentation_states:
  manual_pause_options:
    fixed_seconds: [1800, 3600]
    calendar_deadlines: [user_selected_until, next_local_day_boundary]
    indefinite: until_explicit_resume
    presenting_option_maps_to: held.explicit_presentation_mode
    persistence: reason_and_deadline_survive_relaunch
  paused:
    rule: named_clock_scope_does_not_accrue
    reasons:
      - manual_pause
      - outside_working_hours
      - system_inactive_or_locked
      - system_asleep_or_unavailable
      - qualified_confirmed_away
      - relevant_accepted_ritual
    reason_clock_scope:
      manual_pause: [visual, movement, position, recovery]
      outside_working_hours: [visual, movement, position, recovery]
      system_inactive_or_locked: [visual, movement, position, recovery]
      system_asleep_or_unavailable: [visual, movement, position, recovery]
      qualified_confirmed_away: [visual, movement, position, recovery]
      accepted_visual_ritual: [visual, position]
      accepted_movement_merged_or_recovery_ritual: [visual, movement, position, recovery]
    visible_term: Paused
  held:
    rule: all_clocks_continue_under_their_normal_eligibility
    reasons:
      - user_declared_meeting_or_call
      - user_declared_screen_sharing_or_presentation
      - inferred_likely_call
      - user_selected_timed_task
      - explicit_presentation_mode
      - selected_focus_filter_active
      - selected_calendar_busy_interval
      - selected_application_active
      - snooze
      - low_friction_wait
    visible_term: Held
    evidence_contract:
      required:
        - provenance_kind
        - source_capability_id
        - observed_at_utc
        - expires_at_utc_or_explicit_end
        - qualification
        - correction_action_when_automatic
      provenance_kinds:
        explicit_user_selection:
          confidence_band: not_applicable
          visible_rule: say_what_the_person_selected
        selected_calendar_busy_free:
          confidence_band: not_applicable
          visible_rule: selected_busy_time_never_meeting_or_call
        selected_focus_filter:
          confidence_band: not_applicable
          visible_rule: selected_focus_is_active_never_deep_work_detected
        selected_application:
          confidence_band: not_applicable
          visible_rule: selected_app_is_active_never_task_or_productivity_inference
        inferred_context:
          confidence_band: [low, medium, high]
          visible_rule: always_say_likely_and_name_the_enabled_signal_category
      confirmed_away_requires: explicit_user_away_or_fresh_unambiguous_authorized_evidence
      stale_missing_or_conflicting: unknown_no_hold_no_pause_no_body_claim
  release_corridors_seconds:
    wake_or_unlock: 90
    return_from_long_idle: 60
    hold_release: 90
    manual_pause_resume: 90
    working_hours_reentry: 60
  collision_precedence:
    - manual_pause
    - system_inactive_or_locked
    - system_asleep_or_unavailable
    - relevant_accepted_ritual
    - qualified_confirmed_away
    - outside_working_hours
    - user_declared_meeting_or_call
    - user_declared_screen_sharing_or_presentation
    - inferred_likely_call
    - user_selected_timed_task
    - explicit_presentation_mode
    - selected_focus_filter_active
    - selected_calendar_busy_interval
    - selected_application_active
    - snooze
    - low_friction_wait

action_contract:
  opportunity_phase_graph:
    phases:
      - coordinated
      - heads_up
      - visual_offered
      - visual_running
      - movement_offered
      - movement_running
      - position_offered
      - recovery_offered
      - recovery_running
      - merged_visual_offered
      - merged_visual_running
      - merged_movement_offered
      - merged_movement_running
      - held
      - paused
      - snoozed
      - release_corridor
      - terminal_provisional
      - closed
    edges:
      coordinated: [heads_up, visual_offered, movement_offered, position_offered, recovery_offered, merged_visual_offered, held, paused]
      heads_up: [visual_offered, movement_offered, position_offered, recovery_offered, merged_visual_offered, visual_running, merged_visual_running, held, paused, snoozed, terminal_provisional]
      visual_offered: [visual_running, held, paused, snoozed, terminal_provisional]
      visual_running: [paused, terminal_provisional]
      movement_offered: [movement_running, held, paused, snoozed, terminal_provisional]
      movement_running: [paused, terminal_provisional]
      position_offered: [held, paused, snoozed, terminal_provisional]
      recovery_offered: [recovery_running, held, paused, snoozed, terminal_provisional]
      recovery_running: [paused, terminal_provisional]
      merged_visual_offered: [merged_visual_running, held, paused, snoozed, terminal_provisional]
      merged_visual_running: [merged_movement_offered, paused, terminal_provisional]
      merged_movement_offered: [merged_movement_running, held, paused, terminal_provisional]
      merged_movement_running: [paused, terminal_provisional]
      held: [release_corridor, paused, terminal_provisional]
      paused: [release_corridor, terminal_provisional]
      snoozed: [release_corridor, held, paused, terminal_provisional]
      release_corridor: [visual_offered, movement_offered, position_offered, recovery_offered, merged_visual_offered, held, paused, terminal_provisional]
      terminal_provisional: [closed]
      closed: []
    terminal_slots:
      standalone: opportunity_close
      merged_visual_segment: visual_segment
      merged_opportunity: opportunity_close
    rule: >-
      A transition must use its registered source phase, opportunity kind, participant
      set, segment, and required payload. A phase reached only because of a provisional
      candidate is replayed if that candidate later loses reconciliation.
  nonterminal_reconciliation:
    rule: >-
      Nonterminal actions that name the same opportunity revision and source phase compare
      together, including a global-with-optional-opportunity Pause. Validate guards first,
      then select one winner by the fixed least-interruptive intent rank and stable ActionID.
      The winner alone emits facts/effects and increments the opportunity revision. Losing
      concurrent candidates remain ledger no-ops. A causally later action may run only
      against the resulting revision and phase. Arrival order is never an input.
    least_interruptive_intent_rank_smallest_wins:
      pause.start: 0
      later.snooze: 10
      hold.begin: 20
      companion.take_with_me: 30
      now.accept_visual: 40
      now.accept_movement: 40
      merged.accept: 40
      merged.movement_accept: 40
      now.accept_recovery: 40
      movement.change_content: 50
      merged.movement_change_content: 50
      delivery.shift_to_seam: 60
      opportunity.presented: 70
    winner_sort_key:
      - smallest_intent_rank
      - lexicographically_smallest_action_id
    global_state_rule: >-
      A global action without an opportunity uses the coordinator state revision. Pause and
      hold state is reduced from the complete fresh evidence set using collision_precedence.
      Before an opportunity action commits, that same coordinator revision is checked; a
      concurrently winning global Pause/Held state advances it and makes the incompatible
      opportunity action fail its phase guard. Releases must name the decision or pause
      revision they clear. System samples are reduced by coordinator epoch and monotonic
      sample sequence, not callback arrival.
  clock_effect_definitions:
    accrue: add_only_the_current_valid_sample_interval
    freeze: add_zero_while_the_named_state_or_ritual_is_active
    retain: preserve_accumulated_time_cycle_identity_and_due_state_then_apply_normal_eligibility
    resume: establish_a_new_monotonic_baseline_add_zero_then_apply_normal_eligibility
    fresh_cycle: replace_cycle_id_zero_accumulated_time_and_create_no_completion_fact_by_itself
    restore_pre_ritual: restore_the_exact_snapshot_taken_before_this_ritual_without_offline_catch_up
    deferral_increment: increment_recovery_deferral_load_once_without_changing_another_clock
    fresh_if_screen_away_basis: fresh_cycle_only_with_explicit_or_strong_fresh_screen_away_basis_otherwise_retain
    fresh_if_carried: fresh_cycle_only_when_this_clock_cycle_is_carried_by_the_opportunity_otherwise_retain
    fresh_if_carried_else_deferral_if_movement_carried: fresh_cycle_when_recovery_is_carried_else_increment_once_when_movement_is_carried_else_retain
    continue_eligibility: keep_cycle_and_due_state_while_adding_only_normally_eligible_sample_time
    restore_decision_snapshot: restore_every_affected_cycle_id_time_phase_and_recovery_value_from_the_named_decision
    unchanged: make_no_immediate_clock_mutation
  late_and_invalid_action_rule: >-
    Unknown identity, mismatched participants, unsupported source phase, invalid payload,
    or an action originated after its actor had observed the terminal revision is an
    audited no-op. A valid terminal candidate that originated from an allowed phase and
    revision before that actor learned of closure remains eligible even when it arrives
    after another device provisionally closed the opportunity. Late arrival is not
    staleness; causal origin metadata and guards decide validity.
  transitions:
    - id: opportunity.presented
      terminal: false
      facts: [promptPresented]
      ledgers: [product_fact]
      clocks: {visual: continue_eligibility, movement: continue_eligibility, position: continue_eligibility, recovery: continue_eligibility}
      visible: one_heads_up_projection_for_the_opportunity
      stale: no_op
      recovery: same_opportunity_id_for_every_projection_and_response
    - id: merge.created
      terminal: false
      facts: []
      ledgers: [scheduling_decision]
      clocks: {visual: retain, movement: retain, position: retain, recovery: retain}
      visible: one_opportunity_carries_each_participating_cycle_id
      stale: no_op
      recovery: unmerge_before_acceptance_restores_the_same_independent_cycles
    - id: delivery.shift_to_seam
      terminal: false
      facts: []
      ledgers: [scheduling_decision]
      clocks: {visual: continue_eligibility, movement: continue_eligibility, position: continue_eligibility, recovery: continue_eligibility}
      visible: no_interruption_until_bounded_selected_seam
      stale: no_op
      recovery: latest_preferred_boundary_still_applies_unless_a_hold_is_active
    - id: now.accept_visual
      terminal: false
      facts: [breakStarted]
      ledgers: [product_fact]
      clocks: {visual: freeze, movement: continue_eligibility, position: freeze, recovery: continue_eligibility}
      visible: visual_running_from_first_active_frame
      stale: no_op
      recovery: absolute_deadline_reopens_or_finishes_once
    - id: now.accept_movement
      terminal: false
      facts: [breakStarted]
      ledgers: [product_fact]
      clocks: {visual: freeze, movement: freeze, position: freeze, recovery: freeze}
      visible: selected_300_or_120_second_movement_running_from_acceptance_frame
      stale: no_op
      recovery: absolute_deadline_reopens_or_finishes_once
    - id: later.snooze
      terminal: false
      facts: [snoozed]
      ledgers: [product_fact, operational]
      clocks: {visual: continue_eligibility, movement: continue_eligibility, position: continue_eligibility, recovery: continue_eligibility}
      visible: held_until_selected_300_600_or_900_second_deadline
      stale: no_op
      recovery: same_opportunity_reoffers_once_after_deadline_and_seam
    - id: later.snooze_after_reoffer
      terminal: true
      facts: [snoozed]
      ledgers: [product_fact, operational]
      clocks: {visual: fresh_if_carried, movement: fresh_if_carried, position: fresh_if_carried, recovery: fresh_if_carried_else_deferral_if_movement_carried}
      visible: opportunity_closes_quietly_without_escalation
      stale: reconcile_terminal_candidate
      recovery: wait_for_each_carried_need_next_normal_cycle
    - id: visual.timer_finished
      terminal: true
      facts: [timerFinished]
      ledgers: [product_fact]
      clocks: {visual: fresh_cycle, movement: unchanged, position: unchanged, recovery: unchanged}
      visible: closed_with_quiet_timer_receipt
      stale: reconcile_terminal_candidate
      recovery: visual_return_grace
    - id: visual.done_early
      terminal: true
      facts: [userDeclaredCompleted]
      ledgers: [product_fact]
      clocks: {visual: fresh_cycle, movement: unchanged, position: unchanged, recovery: unchanged}
      visible: closed_immediately
      stale: reconcile_terminal_candidate
      recovery: visual_return_grace
    - id: visual.skip
      terminal: true
      facts: [skipped]
      ledgers: [product_fact]
      clocks: {visual: fresh_cycle, movement: unchanged, position: unchanged, recovery: unchanged}
      visible: closed_immediately_without_acknowledgement
      stale: reconcile_terminal_candidate
      recovery: normal_new_visual_cycle
    - id: visual.escape
      terminal: true
      facts: [skipped]
      ledgers: [product_fact]
      clocks: {visual: fresh_cycle, movement: unchanged, position: unchanged, recovery: unchanged}
      visible: closed_immediately_without_confirmation
      stale: reconcile_terminal_candidate
      recovery: normal_new_visual_cycle
    - id: movement.timer_finished
      terminal: true
      facts: [timerFinished]
      ledgers: [product_fact]
      clocks: {visual: fresh_cycle, movement: fresh_cycle, position: retain, recovery: fresh_cycle}
      visible: closed_with_quiet_timer_receipt
      stale: reconcile_terminal_candidate
      recovery: shared_visual_and_movement_return_grace
    - id: movement.done_early
      terminal: true
      facts: [userDeclaredCompleted]
      ledgers: [product_fact]
      clocks: {visual: fresh_cycle, movement: fresh_cycle, position: retain, recovery: fresh_cycle}
      visible: closed_immediately
      stale: reconcile_terminal_candidate
      recovery: shared_visual_and_movement_return_grace
    - id: movement.already_moved
      terminal: true
      facts: [userDeclaredAlreadyMoved]
      ledgers: [product_fact]
      clocks: {visual: fresh_if_screen_away_basis, movement: fresh_cycle, position: retain, recovery: fresh_cycle}
      visible: closed_immediately_as_user_declaration
      stale: reconcile_terminal_candidate
      recovery: visual_fresh_only_with_explicit_or_strong_fresh_screen_away_basis
    - id: movement.change_content
      terminal: false
      facts: []
      ledgers: [operational]
      clocks: {visual: retain, movement: retain, position: retain, recovery: retain}
      visible: same_running_ritual_with_selected_equal_status_content
      stale: no_op
      recovery: preserve_absolute_deadline
    - id: movement.position_changed
      terminal: true
      facts: [positionChanged]
      ledgers: [product_fact]
      clocks: {visual: restore_pre_ritual, movement: retain, position: fresh_cycle, recovery: retain}
      visible: movement_offer_closed_position_cycle_fresh_movement_still_due
      stale: reconcile_terminal_candidate
      recovery: hold_release_corridor_before_any_movement_reoffer
    - id: movement.skip
      terminal: true
      facts: [skipped]
      ledgers: [product_fact]
      clocks: {visual: restore_pre_ritual, movement: fresh_cycle, position: retain, recovery: deferral_increment}
      visible: closed_immediately_without_completion_credit
      stale: reconcile_terminal_candidate
      recovery: normal_new_movement_cycle_with_recovery_load_retained
    - id: movement.escape
      terminal: true
      facts: [skipped]
      ledgers: [product_fact]
      clocks: {visual: restore_pre_ritual, movement: fresh_cycle, position: retain, recovery: deferral_increment}
      visible: closed_immediately_without_confirmation
      stale: reconcile_terminal_candidate
      recovery: normal_new_movement_cycle_with_recovery_load_retained
    - id: position.changed
      terminal: true
      facts: [positionChanged]
      ledgers: [product_fact]
      clocks: {visual: retain, movement: retain, position: fresh_cycle, recovery: retain}
      visible: position_opportunity_closes_immediately
      stale: reconcile_terminal_candidate
      recovery: position_cycle_only_is_fresh
    - id: position.skip
      terminal: true
      facts: [skipped]
      ledgers: [product_fact]
      clocks: {visual: retain, movement: retain, position: fresh_cycle, recovery: retain}
      visible: position_opportunity_closes_immediately_without_completion_credit
      stale: reconcile_terminal_candidate
      recovery: normal_new_position_cycle_without_rapid_reoffer
    - id: now.accept_recovery
      terminal: false
      facts: [breakStarted]
      ledgers: [product_fact]
      clocks: {visual: freeze, movement: freeze, position: freeze, recovery: freeze}
      visible: recovery_running_from_first_active_frame
      stale: no_op
      recovery: selected_300_or_600_second_absolute_deadline_reopens_or_finishes_once
    - id: recovery.timer_finished
      terminal: true
      facts: [timerFinished]
      ledgers: [product_fact]
      clocks: {visual: fresh_cycle, movement: fresh_cycle, position: retain, recovery: fresh_cycle}
      visible: closed_with_quiet_timer_receipt
      stale: reconcile_terminal_candidate
      recovery: no_second_recovery_offer_in_this_session
    - id: recovery.done_early
      terminal: true
      facts: [userDeclaredCompleted]
      ledgers: [product_fact]
      clocks: {visual: fresh_cycle, movement: fresh_cycle, position: retain, recovery: fresh_cycle}
      visible: closed_immediately

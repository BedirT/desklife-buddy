meta:
  contract: timing-runtime-v2
  version: 2.0
  status: canonical_not_runtime_activated
  decision: D-033
  health_values: ../../research/health/machine-readable/product_protocol.yaml
  product_fact_schema: ../../research/health/machine-readable/event_schema.json
  intended_purpose: >-
    A private general-wellness schedule for visual resets, movement opportunities,
    position variety, and optional recovery without claiming a health outcome.
  prohibited_inference: >-
    No input, idle, timer, camera, motion, companion, or model observation is a
    completion fact or proof of movement, visual relief, posture, or health benefit.

identities:
  clock_cycle_id:
    format: uuid
    scope: one_clock
    created_when:
      - clock_is_enabled_without_an_existing_cycle
      - position_latent_manual_cycle_is_absent_even_when_position_reminders_are_disabled
      - a_fresh_cycle_effect_is_committed
      - a_user_approved_schedule_restart_is_committed
    stable_through:
      - accumulating
      - soft_due
      - heads_up
      - held
      - snoozed
      - running
      - relaunch
      - position_reminder_enablement_changes
    rule: >-
      A merged opportunity carries each participating ClockCycleID. It never
      replaces them with a merged clock identity.
  opportunity_id:
    format: uuid
    scope: one_coordinated_offer
    created_when: arbiter_selects_one_or_more_due_clock_cycles
    stable_through:
      - every_projection_on_mac_iphone_and_watch
      - heads_up_and_break_surfaces
      - snooze_and_reoffer
      - relaunch_and_handoff
    closed_when: terminal_candidate_settles_or_timerRecoveryUnavailable_operational_disposition_commits
  global_state_id:
    format: uuid
    scope: one_installation_coordinator_state
    created_when: first_v2_coordinator_state_is_committed_or_local_data_is_reset
    stable_through:
      - every_global_system_and_schedule_command
      - relaunch
      - coordinator_epoch_change
      - companion_projection
    rule: >-
      GlobalStateID names the installation's scheduling/evidence state. Its monotonically
      increasing revision is the concurrency identity for commands that are not owned by
      one OpportunityID; it is never substituted for an opportunity or product fact.
  coordinator_generation:
    format: unsigned_uint64
    scope: global_state_id
    persistence: atomically_retained_with_global_revision_projection_high_water_and_fences
    increments_when: coordinator_monotonic_epoch_or_authority_continuity_is_lost
    rule: >-
      Generation is restart-safe causal authority, not elapsed time. Every action and lease
      names the exact generation in which it originated. A committed generation fence makes
      all lower-generation actions ineligible even when they were in flight before reboot.
  opportunity_projection_epoch_id:
    format: uuid
    scope: opportunity_id_within_coordinator_generation
    created_when: first_projection_lease_for_the_opportunity_is_committed
    closed_when: terminal_or_operational_opportunity_fence_is_committed
    rule: >-
      Every projection and terminal candidate names this epoch. It is revoked on every
      opportunity closure before any successor cycle or OpportunityID becomes eligible.
  action_id:
    format: uuid
    scope: one_user_system_or_companion_action
    idempotency: duplicate_action_id_replays_the_original_outcome_or_truthful_settlement_receipt_without_reapplying_effects
    required_context:
      - opportunity_id_when_opportunity_scoped
      - participating_clock_cycle_ids
      - origin_device_id
      - origin_session_id
      - origin_revision
      - coordinator_generation
      - opportunity_projection_epoch_id_when_opportunity_scoped
      - origin_phase
      - origin_segment_id_when_segmented
      - origin_device_counter
      - causal_parent_action_ids
  decision_id:
    format: uuid
    scope: one_automatic_hold_release_shift_merge_or_schedule_restart
    rule: >-
      A DecisionID belongs only to the scheduling-decision ledger and can never
      be substituted for an ActionID or a product completion fact.
  device_id:
    format: locally_generated_uuid
    lifetime: installation_until_local_reset
    privacy: never_vendor_or_account_identity
  session_id:
    format: uuid
    lifetime: one_process_run_or_companion_extension_session
  portable_canonical_encoding:
    version: cadence_contract_bytes_v1
    hash_algorithm: sha256
    domain_separation: utf8_length_prefixed_contract_name_and_identifier_kind
    scalar_encoding:
      uuid: lowercase_rfc4122_text_is_parsed_then_encoded_as_16_network_order_bytes
      string: unicode_nfc_utf8_with_uint32_big_endian_byte_length
      enum: registered_ascii_identifier_with_uint16_big_endian_byte_length
      integer: unsigned_uint64_big_endian
      byte_string: uint32_big_endian_byte_length_then_unmodified_bytes
      optional: one_byte_presence_tag_then_value_when_present
      tagged_union: uint16_big_endian_registered_variant_tag_then_variant_payload
      struct: fields_encoded_in_the_exact_registered_schema_order_without_host_field_names
    collection_encoding:
      list: uint32_big_endian_count_then_items_in_declared_order
      set: canonical_item_bytes_sorted_unsigned_lexicographically_then_encoded_as_list
      map: canonical_key_bytes_sorted_unsigned_lexicographically_then_key_value_pairs
    lexical_order: compare_canonical_unsigned_byte_sequences_not_locale_or_platform_strings
    prohibited_inputs: [wall_time, localized_copy, process_hash_seed, pointer_address]
    output: lowercase_hex_digest_prefixed_with_sha256_colon
  portable_identifier_contract:
    uuid_generation: rfc4122_version_4_from_local_cryptographic_random_bytes
    wire_text: lowercase_hyphenated_rfc4122
    parse_rule: reject_non_rfc4122_or_wrong_version_when_a_version_is_registered
    comparison: normalized_16_uuid_bytes_unsigned_lexicographic
    deterministic_identifier_rule: >-
      Any deterministic ID or hash uses portable_canonical_encoding with an explicit domain
      literal and registered ordered input schema. Implementations never serialize host structs,
      native integer layout, locale order, or unordered collection iteration directly.

time:
  wall_metadata:
    required:
      - recorded_at_utc
      - origin_time_zone_identifier
    deadline_records_also_require:
      - deadline_at_utc
      - anchor_recorded_at_utc
      - remaining_seconds_at_anchor
    purpose: display_exchange_and_audit_only_never_countdown_reconstruction
  local_monotonic_anchor:
    clock: continuous_monotonic
    required:
      - monotonic_epoch_id
      - anchor_ticks
      - remaining_seconds_at_anchor
    rule: >-
      Within a live monotonic epoch, elapsed duration and ordering use monotonic
      ticks. Wall-clock changes never add schedule-clock time.
  schedule_clock_restore:
    rule: >-
      Persist accumulated eligible seconds and phase. On restore, establish a new
      monotonic baseline at the first valid sample and add zero elapsed seconds for
      shutdown, sleep, an unavailable session, or an unobserved gap.
  accepted_ritual_deadline:
    rule: >-
      A running visual, movement, merged, or recovery segment has one coordinator-issued
      deadline ID and a continuous-monotonic deadline. Persist the boot/clock epoch,
      anchor ticks, selected duration, last known remaining duration, and opportunity
      revision, coordinator generation, and projection epoch. If the exact continuous epoch cannot be resumed, elapsed duration is
      unknown: close through the operational timerRecoveryUnavailable disposition,
      emit no timerFinished, preserve the affected due schedules, and allow the normal
      arbiter to create a new OpportunityID only after the old projection epoch is fenced,
      its admitted candidates settle, and recovery grace elapses. Wall time never
      reconstructs or extends remaining duration.
    persisted_anchor_requires:
      - deadline_id
      - coordinator_device_id
      - monotonic_epoch_id
      - accepted_at_ticks
      - deadline_ticks
      - selected_duration_seconds
      - last_known_remaining_seconds
      - opportunity_revision
      - coordinator_generation
      - opportunity_projection_epoch_id
    same_epoch_restore: remaining_is_max_zero_deadline_ticks_minus_current_ticks
    epoch_or_anchor_discontinuity: timerRecoveryUnavailable_operational_only_no_product_fact_no_fresh_cycle
    wall_clock_change: ignored_for_countdown
    handoff:
      authority_before_ack: sender_deadline_remains_authoritative
      acknowledgement_requires:
        - deadline_id_and_opportunity_revision
        - sender_epoch_and_send_ticks
        - receiver_epoch_and_receive_ticks
        - bounded_round_trip_uncertainty
        - final_sender_commit_ticks
      commit_rule: >-
        Transfer only after a bounded monotonic handshake. The receiving deadline uses
        the sender's remaining duration at final commit minus the full measured
        uncertainty bound. If the bound, epochs, revision, or acknowledgement is missing
        or stale, do not transfer; the sender remains authoritative. A negative result
        expires immediately. Wall clocks never choose remaining duration.
    on_return_after_deadline: timer_finished_once_only_when_same_epoch_monotonic_elapsed_is_greater_than_or_equal_to_deadline
    recovery_unavailable:
      operational_kind: timerRecoveryUnavailable
      product_facts: []
      close: settle_admitted_same_generation_candidates_then_commit_operational_disposition_and_projection_epoch_fence
      clock_rule: retain_every_current_cycle_id_accumulated_time_due_state_and_independent_final_component_effect
      grace_seconds: 60
      grace_begins: after_signed_fence_and_operational_disposition_commit
      reoffer_rule: normal_arbiter_may_create_a_new_opportunity_id_after_fence_then_grace
      failure_rule: >-
        If the disposition/fence transaction cannot commit, close the unusable surface, show
        the honest recovery/sync-failure projection, and keep successor eligibility blocked;
        never manufacture a fact, elapsed time, or fresh cycle.
    lifecycle_return_order:
      - reconcile_companion_terminal_candidates
      - resolve_local_absolute_deadline
      - apply_the_single_winning_terminal_effect_if_any
      - otherwise_resume_the_same_running_ritual
      - only_then_evaluate_schedule_clock_release_corridors
  system_unavailable_interval:
    anchor: continuous_monotonic_epoch_and_start_ticks
    return_rule: >-
      When the same monotonic epoch proves system-unavailable elapsed time is at least
      300 seconds and no accepted ritual remains unresolved, record one
      likelyNaturalInterruption, start a fresh visual schedule as courtesy, preserve
      movement/position/recovery need, and apply 60 seconds of return grace. Unknown or
      discontinuous elapsed time does not earn this courtesy and creates no product fact.
  observation_gap:
    expected_sample_seconds: 5
    maximum_covered_interval_seconds: 15
    rule: >-
      A non-finite, backward, or longer adjacent sample interval establishes a new
      baseline and accrues zero time. There is no catch-up.
  working_hours:
    evaluation: local_wall_calendar_boundary
    metadata: time_zone_identifier_and_resolved_next_boundary
    rule: >-
      Working-hour boundaries choose Paused versus eligible state. They never
      supply elapsed schedule time; monotonic samples inside an eligible window do.
  boundary_predicates:
    universal_deadline: elapsed_seconds_greater_than_or_equal_to_deadline_seconds
    recent_input_eligible: seconds_since_input_less_than_or_equal_to_60
    long_idle_begins: seconds_since_input_greater_than_or_equal_to_300
    valid_covered_sample: adjacent_interval_seconds_less_than_or_equal_to_15
    invalid_sample_gap: adjacent_interval_seconds_greater_than_15
    release_corridor_active: elapsed_seconds_less_than_corridor_seconds
    release_corridor_ends: elapsed_seconds_greater_than_or_equal_to_corridor_seconds
    snooze_active: elapsed_seconds_less_than_selected_snooze_seconds
    snooze_reoffers: elapsed_seconds_greater_than_or_equal_to_selected_snooze_seconds
    due_boundary: accumulated_eligible_seconds_greater_than_or_equal_to_configured_boundary
    rule: evaluate_each_edge_once_and_never_use_strict_greater_than_for_a_deadline

clock_contract:
  visual:
    meaning: visual_reset_schedule_based_on_estimated_active_computer_use
    permission_free_accrual: >-
      Awake, active, unlocked, inside enabled working hours, not manually paused,
      not in any accepted ritual, not in a qualified confirmed-away interval,
      and covered by adjacent valid samples. Input silence below long-idle onset
      remains eligible so passive reading is not treated as a visual reset. This is
      not a gaze, face-presence, viewing-distance, or near-screen estimate.
  movement:
    meaning: movement_opportunity_schedule_based_on_estimated_active_computer_use
    permission_free_accrual: >-
      The same system eligibility as visual plus recent input at or below 60 seconds.
      Input silence over 60 seconds freezes this schedule; it estimates neither body
      stillness nor movement and never proves either.
  position:
    meaning: optional_position_change_schedule_based_on_estimated_active_computer_use_or_user_interval
    permission_free_accrual: >-
      Optional/manual. When enabled without sensing, it accrues under visual
      eligibility, freezes during every accepted ritual, and stops at long-idle
      onset. It estimates no body position, stability, or posture score.
    explicit_action_eligibility: >-
      A reachable positionChanged action may commit while position accrual is frozen by an
      accepted movement or merged ritual. The action changes the exact named position cycle;
      it adds no elapsed time, proves no body position, and does not complete movement.
    latent_manual_cycle:
      always_present: true
      identity: current_position_clock_cycle_id
      disabled_schedule_state: manual_only_no_accrual_no_due_no_offer
      explicit_position_changed_effect: rotate_latent_cycle_without_enabling_reminders
      enablement_rule: >-
        Enabling reminders begins scheduling on the current latent cycle under the selected
        preset; disabling reminders returns it to manual-only state. Neither a first-frame
        Change position action nor its fresh-cycle effect changes the enablement preference.
  recovery:
    meaning: optional_recovery_schedule_from_eligible_interaction_time_and_explicit_deferrals
    permission_free_accrual: >-
      Accrues only while movement timing is eligible after a movement deferral.
      It creates at most one optional recovery offer and is never a risk state.
  qualified_optional_assessment:
    rule: >-
      Near-screen, likely movement, likely away, or position assessments may exist only
      in a separately authorized capability. Every assessment carries source capability,
      provenance, observation time, expiry, qualification, confidence band, and a
      correction path. Missing, stale, conflicting, or unavailable evidence is unknown
      and cannot mutate a schedule unless an approved rule explicitly accepts unknown.

presentation_states:
  manual_pause_options:
    fixed_seconds: [1800, 3600]
    calendar_deadlines: [user_selected_until, next_local_day_boundary]
    indefinite: until_explicit_resume
    presenting_option_maps_to: held.explicit_presentation_mode
    persistence: reason_and_deadline_survive_relaunch
  paused:
    rule: named_clock_scope_does_not_accrue
    reasons:
      - manual_pause
      - outside_working_hours
      - system_inactive_or_locked
      - system_asleep_or_unavailable
      - qualified_confirmed_away
      - relevant_accepted_ritual
    reason_clock_scope:
      manual_pause: [visual, movement, position, recovery]
      outside_working_hours: [visual, movement, position, recovery]
      system_inactive_or_locked: [visual, movement, position, recovery]
      system_asleep_or_unavailable: [visual, movement, position, recovery]
      qualified_confirmed_away: [visual, movement, position, recovery]
      accepted_visual_ritual: [visual, position]
      accepted_movement_merged_or_recovery_ritual: [visual, movement, position, recovery]
    visible_term: Paused
  held:
    rule: all_clocks_continue_under_their_normal_eligibility
    reasons:
      - user_declared_meeting_or_call
      - user_declared_screen_sharing_or_presentation
      - inferred_likely_call
      - user_selected_timed_task
      - explicit_presentation_mode
      - selected_focus_filter_active
      - selected_calendar_busy_interval
      - selected_application_active
      - snooze
      - low_friction_wait
    visible_term: Held
    evidence_contract:
      required:
        - provenance_kind
        - source_capability_id
        - observed_at_utc
        - expires_at_utc_or_explicit_end
        - qualification
        - correction_action_when_automatic
      provenance_kinds:
        explicit_user_selection:
          confidence_band: not_applicable
          visible_rule: say_what_the_person_selected
        selected_calendar_busy_free:
          confidence_band: not_applicable
          visible_rule: selected_busy_time_never_meeting_or_call
        selected_focus_filter:
          confidence_band: not_applicable
          visible_rule: selected_focus_is_active_never_deep_work_detected
        selected_application:
          confidence_band: not_applicable
          visible_rule: selected_app_is_active_never_task_or_productivity_inference
        inferred_context:
          confidence_band: [low, medium, high]
          visible_rule: always_say_likely_and_name_the_enabled_signal_category
      confirmed_away_requires: explicit_user_away_or_fresh_unambiguous_authorized_evidence
      stale_missing_or_conflicting: unknown_no_hold_no_pause_no_body_claim
  release_corridors_seconds:
    wake_or_unlock: 90
    return_from_long_idle: 60
    hold_release: 90
    manual_pause_resume: 90
    working_hours_reentry: 60
  collision_precedence:
    - manual_pause
    - system_inactive_or_locked
    - system_asleep_or_unavailable
    - relevant_accepted_ritual
    - qualified_confirmed_away
    - outside_working_hours
    - user_declared_meeting_or_call
    - user_declared_screen_sharing_or_presentation
    - inferred_likely_call
    - user_selected_timed_task
    - explicit_presentation_mode
    - selected_focus_filter_active
    - selected_calendar_busy_interval
    - selected_application_active
    - snooze
    - low_friction_wait
  evidence_reduction:
    rule: >-
      Every begin or clear mutates only its named evidence record, then reduces the
      complete current evidence set by collision_precedence. No resume, release,
      working-hours, or system callback may target a corridor unconditionally.
    nonrunning_projection:
      paused_evidence_remains: paused
      else_held_evidence_remains: held
      else_after_release: release_corridor
    running_projection:
      rule: >-
        Paused and Held are orthogonal presentation/evidence overlays. Preserve the
        exact running opportunity phase, segment, accepted deadline, snapshot, and
        coordinator revision while callbacks or presentation are unavailable. On clear,
        reduce all remaining evidence first. The running ritual's own relevant_accepted_ritual
        reason remains an intrinsic clock-scope freeze, not an external overlay that can hide or
        strand its surface. If no external Paused/Held evidence remains and the same
        monotonic epoch proves the deadline is still future, resume that same running
        segment immediately without a release corridor. If elapsed is proven, reconcile
        its timer candidate. If timing is unknowable, use timerRecoveryUnavailable.
      suspended_state_requires:
        - opportunity_id_and_revision
        - exact_running_phase_and_segment_id
        - accepted_deadline_checkpoint
        - preterminal_snapshot_id
        - active_evidence_record_ids

action_contract:
  participant_contract:
    registered_base_sets:
      visual: [visual]
      movement: [movement]
      position: [position]
      recovery: [visual, movement, recovery]
      merged: [visual, movement]
    rule: >-
      Opportunity identity always carries its registered base set. An action may affect a
      nonparticipant clock only when its guard declares that affected clock and its payload
      names the exact current ClockCycleID. The affected reference enters validation,
      snapshot closure, and clock effects but never changes the opportunity participant set.
    affected_nonparticipant_actions:
      movement.position_changed_offered: [position]
      movement.position_changed_running: [position]
      merged.movement_position_changed: [position]
    guard_meanings:
      exactly_visual: [visual]
      exactly_movement: [movement]
      exactly_position: [position]
      exactly_visual_movement_and_recovery: [visual, movement, recovery]
      exactly_visual_and_movement: [visual, movement]
      exact_registered_participant_set: registered_base_set_for_each_opportunity_kind
      nonempty_subset_of_registered_participants: nonempty_subset_of_registered_base_set
      all_enabled_clocks: global_evidence_scope_not_opportunity_participants
      visual_movement_and_recovery: global_decision_scope_not_opportunity_participants
      exact_decision_affected_clocks: decision_snapshot_scope_not_opportunity_participants
  authoritative_action_coordinator:
    lease_maximum_seconds: 90
    exclusive_grant_rule: >-
      Only one causal-frontier transaction may commit for the GlobalStateID at a time.
      Opportunity grants are children of the exact global revision. Within that transaction,
      requests are partitioned by registered conflict key. One winner is selected per key,
      every compatible winner across disjoint keys is applied in canonical key order, and the
      full Paused/Held evidence state is reduced once. Callback arrival is never a rank.
    scope_contract:
      opportunity:
        phase_scopes: [opportunity, opportunity_origin]
        identity_fields: [opportunity_id, opportunity_revision]
        forbidden_fields: [global_state_id]
      global:
        phase_scopes: [global_with_optional_opportunity, global_schedule]
        identity_fields: [global_state_id, global_state_revision]
        forbidden_identity_fields: [opportunity_id]
        optional_atomic_opportunity_context_fields:
          - expected_opportunity_id
          - expected_opportunity_revision
          - expected_opportunity_projection_epoch_id
          - expected_running_phase_and_segment_id
        optional_context_rule: >-
          Opportunity context is compare-and-fence metadata, never the global command identity.
          If a running opportunity exists, a suspending or availability-changing global command
          must provide the exact expected context or revalidate before it may commit.
    lease_requires:
      - exactly_one_registered_scope_kind_and_scope_identity
      - coordinator_generation
      - global_linearization_frontier
      - coordinator_device_id_and_monotonic_epoch
      - granted_device_id
      - granted_at_ticks
      - expires_at_ticks_not_more_than_90_seconds_after_grant
      - next_command_sequence
    rule: >-
      Every effect-bearing nonterminal command, whether opportunity-scoped, global, system,
      or schedule-scoped, requires a live coordinator lease (a local coordinator may issue its
      own monotonic self-lease) tagged with exactly one registered scope. Opportunity commands
      use OpportunityID plus opportunity revision. Global, system, and schedule commands use
      stable GlobalStateID plus global revision. A running opportunity is named only through
      optional expected compare-and-fence metadata, never as the global command identity. Each is
      linearized before any product fact, deadline, phase, or
      clock effect is exposed. The coordinator atomically commits the command, fact,
      deadline/snapshot when applicable, and successor revision, then acknowledges it. No
      provisional nonterminal effect exists to roll back. An offline device may retain only an operational user
      intent; it cannot originate Later, Now, content, merge, release, or another effect
      until a renewed lease revalidates the then-current phase and revision. Thus offline
      Later cannot orphan a concurrently committed breakStarted or deadline.
    atomic_global_running_commit:
      applies_to:
        - pause.start
        - pause.resume
        - hold.begin
        - hold.release
        - hold.correction_release
        - working_hours.exit
        - working_hours.enter
        - system.unavailable
        - system.available
        - system.available_after_extended_unavailable
      order:
        - validate_global_state_id_revision_generation_and_conflict_key
        - compare_expected_opportunity_id_revision_projection_epoch_phase_and_segment_when_running
        - stop_and_revoke_old_opportunity_projection_leases
        - reject_every_uncommitted_candidate_for_the_old_revision_with_a_current_state_receipt
        - advance_and_fence_the_old_opportunity_revision
        - preserve_or_resume_the_exact_running_phase_segment_deadline_and_snapshot_as_the_command_requires
        - commit_all_disjoint_evidence_winners_and_reduce_full_evidence_state
        - acknowledge_global_and_opportunity_successor_revisions_together
      reverse_arrival_rule: >-
        A Watch terminal action from the fenced opportunity revision is rejected as expired and
        receives the current projected state even when its callback arrives before the global
        command acknowledgement. It cannot finish, skip, or reset the suspended ritual.
      already_committed_rule: >-
        If a terminal action committed first, it already advanced the opportunity revision; the
        global command's expected compare fails and the global command revalidates against the
        resulting closed or successor state. There is no rollback of an acknowledged terminal.
  action_id_replay_contract:
    raw_payload_lifecycle: product_facts.candidate_data_lifecycle
    compact_receipt_fields:
      - sha256_action_id_digest
      - origin_device_id_and_counter
      - original_outcome_code
      - resulting_global_and_opportunity_revisions
      - acknowledgement_or_fence_code
    compact_receipt_rule: memory_only_no_raw_payload_no_health_or_product_fact_no_export
    maximum_receipt_seconds: 90
    exact_duplicate_while_receipt_present: replay_original_outcome_and_ack_without_reapplying_any_effect_fact_notification_or_haptic
    duplicate_after_receipt_expiry_at_or_below_committed_high_water: already_received_and_settled_show_current_projected_state
    unseen_stale_action_above_high_water_or_from_fenced_generation: expired_before_acceptance_show_current_projected_state
    user_receipts:
      exact_duplicate: Action already received. Showing the recorded result.
      settled_high_water: Action already received and settled. Showing the current timer.
      unseen_stale: That action expired before it could be accepted. Showing the current timer.
    lost_ack_trace:
      - first_action_commits_effect_once_and_ack_is_lost
      - retry_with_same_action_id_matches_compact_receipt
      - coordinator_replays_original_outcome_and_successor_revision
      - effect_fact_notification_and_haptic_counts_remain_one
    prohibited_copy: no_change_was_recorded
  generation_and_closure_fence:
    maximum_settlement_seconds: 90
    closure_coverage_selector: every_action_contract_transition_whose_terminal_field_is_true
    closure_coverage_rule: >-
      The selector is exhaustive: every matching transition, including operational recovery and
      parent closure inside a cross-slot resolver, must complete every_opportunity_closure_order.
      Component-only transitions whose terminal field is false advance the parent revision and
      fence their component slot through the cross-slot arbiter without closing the OpportunityID.
    persisted_coordinator_state_requires:
      - global_state_id
      - global_state_revision
      - coordinator_generation
      - committed_action_counter_high_water_by_paired_device
      - active_opportunity_projection_epoch_ids
      - last_committed_fence_digest_bytes
      - installation_local_signing_public_key_fingerprint
    signed_fence_requires:
      - global_state_id
      - closing_coordinator_generation
      - successor_coordinator_generation
      - opportunity_id_and_projection_epoch_when_opportunity_scoped
      - admitted_action_counter_high_water_by_device
      - selected_projection_revision_or_operational_disposition
      - fence_reason
      - ed25519_signature_from_installation_local_coordinator_key
    signed_fence_portable_encoding:
      domain_literal: cadence.timing-runtime-v2.projection-fence.v1
      schema_version: 1
      canonical_bytes_version: cadence_contract_bytes_v1
      ordered_typed_fields:
        - {name: domain_literal, type: string}
        - {name: schema_version, type: unsigned_uint64}
        - {name: global_state_id, type: uuid}
        - {name: global_state_revision, type: unsigned_uint64}
        - {name: closing_coordinator_generation, type: unsigned_uint64}
        - {name: successor_coordinator_generation, type: unsigned_uint64}
        - {name: opportunity_context, type: optional_struct_opportunity_id_uuid_projection_epoch_uuid}
        - {name: admitted_action_counter_high_water_by_device, type: map_uuid_to_unsigned_uint64}
        - {name: selected_outcome, type: tagged_union_projection_revision_uint64_or_operational_disposition_enum}
        - {name: fence_reason, type: enum}
        - {name: previous_fence_digest, type: optional_32_byte_string}
      normalization:
        uuid: identities.portable_canonical_encoding.scalar_encoding.uuid
        string: identities.portable_canonical_encoding.scalar_encoding.string
        optional: identities.portable_canonical_encoding.scalar_encoding.optional
        map: identities.portable_canonical_encoding.collection_encoding.map
        tagged_union: identities.portable_canonical_encoding.scalar_encoding.tagged_union
      digest: sha256_of_exact_ordered_typed_canonical_bytes_as_32_raw_bytes
      signing_input: utf8_cadence_projection_fence_signature_v1_then_32_digest_bytes
      signature: ed25519_with_installation_local_coordinator_private_key
      verification_order:
        - reject_unknown_domain_schema_version_type_or_union_tag
        - normalize_and_reencode_every_field
        - recompute_sha256_and_constant_time_compare_the_32_digest_bytes
        - verify_ed25519_signature_against_the_pinned_local_public_key_fingerprint
        - verify_previous_fence_digest_equals_last_committed_fence_digest_bytes
        - only_then_advance_generation_revision_high_water_or_projection_epoch
      storage_rule: last_committed_fence_digest_bytes_is_exactly_32_unencoded_bytes_hex_is_display_only
    every_opportunity_closure_order:
      - stop_new_projection_leases_for_the_opportunity_epoch
      - reduce_only_admitted_candidates_from_the_same_live_generation
      - commit_one_terminal_projection_or_operational_disposition
      - commit_signed_high_water_projection_epoch_fence
      - revoke_every_unacknowledged_lease_for_that_projection_epoch
      - discard_ephemeral_candidate_buffers
      - then_allow_successor_cycle_or_opportunity_eligibility
    coordinator_epoch_loss_order:
      - load_persisted_global_state_generation_high_water_and_any_provisional_projection
      - settle_the_persisted_provisional_projection_if_present_without_waiting_for_unseen_actions
      - atomically_commit_old_generation_fence_and_increment_generation
      - reject_every_later_arriving_old_generation_action_as_operational_no_op
      - expose_honest_rejected_or_sync_failure_receipt
      - then_issue_new_generation_leases
    old_generation_receipt: action_expired_before_acceptance_show_current_projected_state
    bounded_rule: >-
      A live coordinator completes settlement/fence within 90 monotonic seconds. Epoch loss
      never waits for an old monotonic expiry it can no longer prove: restart fences the old
      generation from persisted high water before projecting anything. If the atomic fence
      cannot commit, the surface closes with an honest sync-failure state and successor
      eligibility remains blocked until retry; an in-flight old-generation action is never
      treated as valid merely because it originated before reboot.
  terminal_projection_lease:
    maximum_seconds: 90
    origin_requires:
      - coordinator_issued_projection_lease_id
      - global_state_id_and_coordinator_generation
      - opportunity_id_revision_phase_and_segment
      - opportunity_projection_epoch_id
      - device_id_and_mapped_local_monotonic_epoch
      - granted_and_expires_coordinator_ticks
      - causal_ack_of_projection_revision
    eligibility: action_origin_must_be_monotonically_proven_before_lease_expiry_and_match_the_current_unfenced_generation_and_projection_epoch
    renewal: requires_online_coordinator_ack_and_never_extends_more_than_90_seconds_per_lease
    settlement: >-
      Keep the candidate set and preterminal snapshot only in Class-0 memory until every issued projection lease
      is causally acknowledged/revoked or its coordinator-monotonic expiry passes. Then
      settle and fence once within 90 seconds, reject every later origin for that projection
      epoch, erase raw losing/duplicate arrivals, and only then permit successor cycles. No
      wall clock ranks or extends a lease. Epoch loss uses the persisted generation fence,
      never an unverifiable old monotonic expiry.
    successor_safety: predecessor_action_ids_can_never_mutate_a_settled_successor_cycle
  resolver_membership:
    rule: every_transition_id_belongs_to_exactly_one_named_resolver
    authoritative_opportunity_nonterminal:

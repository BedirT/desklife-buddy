        Verification selects the persisted installation-local Ed25519 public key's exact 32 raw
        bytes by the signed coordinator_key_id and coordinator_key_epoch. Its SHA-256 fingerprint
        is derived display metadata only and can never select, replace, or verify a key. Paired
        devices receive the actual public key, key ID, and epoch through the authenticated local
        pairing record.
      verification_order:
        - reject_unknown_domain_schema_version_type_width_enum_value_union_tag_or_collection_cardinality
        - normalize_and_reencode_every_field
        - require_predecessor_revision_matches_current_unfenced_projection_and_successor_matches_committed_rebase
        - recompute_sha256_and_constant_time_compare_the_32_digest_bytes
        - verify_ed25519_signature_against_the_persisted_32_byte_installation_public_key_selected_by_signed_coordinator_key_id_and_epoch
        - verify_previous_fence_digest_equals_last_committed_fence_digest_bytes
        - only_then_advance_generation_revision_high_water_or_projection_epoch
      storage_rule: last_committed_fence_digest_bytes_is_exactly_32_unencoded_bytes_hex_is_display_only
      mutation_guards:
        - swapping_predecessor_and_successor_revision_fails_direction_and_signature_verification
        - reordering_named_fields_changes_canonical_bytes_and_fails_digest_verification
        - changing_any_registered_name_tag_width_map_order_or_cardinality_fails_before_signature_acceptance
      executable_known_vector:
        values: {global_state_id: 00000000-0000-0000-0000-000000000001, global_state_revision: 7, closing_coordinator_generation: 3, successor_coordinator_generation: 4, coordinator_key_epoch: 2, coordinator_key_id_hex: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff, opportunity_id: 00000000-0000-0000-0000-000000000010, projection_epoch_id: 00000000-0000-0000-0000-000000000011, predecessor_opportunity_revision: 10, successor_opportunity_revision: 11, selected_projection_revision: 11, fence_reason: global_evidence_revision_rebase}
        supplied_high_water_map_order: [00000000-0000-0000-0000-000000000002, 00000000-0000-0000-0000-000000000001]
        canonical_high_water_pairs: [[00000000-0000-0000-0000-000000000001, 4], [00000000-0000-0000-0000-000000000002, 5]]
        previous_fence_digest_hex: abababababababababababababababababababababababababababababababab
        canonical_bytes_hex: 
        sha256_hex: f9d6e4d589f959c735b74e6f38701e2643e1d27155417dee8abad6af2996cca7
    every_opportunity_closure_order:
      - stop_new_projection_leases_for_the_opportunity_epoch
      - reduce_only_admitted_candidates_from_the_same_live_generation
      - commit_one_terminal_projection_or_operational_disposition
      - commit_signed_high_water_projection_epoch_fence
      - revoke_every_unacknowledged_lease_for_that_projection_epoch
      - discard_ephemeral_candidate_buffers
      - then_allow_successor_cycle_or_opportunity_eligibility
    coordinator_epoch_loss_order:
      - load_persisted_global_state_generation_high_water_and_any_provisional_projection
      - settle_the_persisted_provisional_projection_if_present_without_waiting_for_unseen_actions
      - atomically_commit_old_generation_fence_and_increment_generation
      - reject_every_later_arriving_old_generation_action_as_operational_no_op
      - expose_honest_rejected_or_sync_failure_receipt
      - then_issue_new_generation_leases
    old_generation_receipt: action_too_old_to_verify_show_current_projected_state
    bounded_rule: >-
      A live coordinator completes settlement/fence within 90 monotonic seconds. Epoch loss
      never waits for an old monotonic expiry it can no longer prove: restart fences the old
      generation from persisted high water before projecting anything. If the atomic fence
      cannot commit, the surface closes with an honest sync-failure state and successor
      eligibility remains blocked until retry; an in-flight old-generation action is never
      treated as valid merely because it originated before reboot.
  terminal_projection_lease:
    maximum_seconds: 90
    origin_requires:
      - coordinator_issued_projection_lease_id
      - global_state_id_and_coordinator_generation
      - opportunity_id_revision_phase_and_segment
      - opportunity_projection_epoch_id
      - device_id_and_mapped_local_monotonic_epoch
      - granted_and_expires_coordinator_ticks
      - causal_ack_of_projection_revision
    eligibility: action_origin_must_be_monotonically_proven_before_lease_expiry_and_match_the_current_unfenced_generation_and_projection_epoch
    renewal: requires_online_coordinator_ack_and_never_extends_more_than_90_seconds_per_lease
    settlement: >-
      Keep the candidate set and preterminal snapshot only in Class-0 memory until every issued projection lease
      is causally acknowledged/revoked or its coordinator-monotonic expiry passes. Then
      settle and fence once within 90 seconds, reject every later origin for that projection
      epoch, erase raw losing/duplicate arrivals, and only then permit successor cycles. No
      wall clock ranks or extends a lease. Epoch loss uses the persisted generation fence,
      never an unverifiable old monotonic expiry.
    successor_safety: predecessor_action_ids_can_never_mutate_a_settled_successor_cycle

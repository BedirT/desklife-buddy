<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .win { position: absolute; border-radius: 10px; background: #fbfbfc; box-shadow: 0 26px 60px rgba(24,28,34,0.34); overflow: hidden; }
    .wbar { height: 32px; background: #f0f1f3; border-bottom: 1px solid #e0e2e6; display: flex; align-items: center; padding: 0 12px; gap: 7px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #d4d7dc; }
    .ln { height: 8px; border-radius: 2px; background: #e7e9ed; }
    .kc { display: inline-flex; align-items: center; justify-content: center; height: 17px; min-width: 28px; padding: 0 5px; border-radius: 4px; border: 1px solid rgba(40,48,58,0.24); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6a717b; }
    .sc-l { font-size: 9.5px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; color: #858c96; }
    .sc-t { height: 9px; background-image: repeating-linear-gradient(to right, rgba(90,100,115,0.26) 0 1px, transparent 1px 5px); }
    .sc-t > i { display: block; height: 9px; background-image: repeating-linear-gradient(to right, #4d6b93 0 1px, transparent 1px 5px); }
    .hud { position: absolute; border-radius: 12px; background: rgba(249,250,251,0.95); backdrop-filter: blur(50px); border: 0.5px solid rgba(40,48,58,0.16); box-shadow: 0 24px 60px rgba(20,24,30,0.34), 0 1px 3px rgba(20,24,30,0.16); }
    .cb { height: 28px; padding: 0 14px; border-radius: 7px; display: inline-flex; align-items: center; font-size: 13px; }
    .orow { display: flex; align-items: baseline; gap: 14px; padding: 11px 0; }
    .orow + .orow { border-top: 1px solid #e6e9ed; }
    .orow .t { font-size: 14px; color: #1c1f24; width: 168px; flex: none; }
    .orow .d { font-size: 12.5px; color: #767d87; flex: 1; line-height: 1.4; }
    .orow .n { font-size: 12.5px; color: #1c1f24; font-variant-numeric: tabular-nums; flex: none; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; inset: 0; background: linear-gradient(163deg, #a6abb2 0%, #878d96 46%, #666c75 100%);"></div>

  <div class="win" style="left: 96px; top: 108px; width: 720px; height: 560px;">
    <div class="wbar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 10px;">
      <div class="ln" style="width: 58%;"></div><div class="ln" style="width: 81%;"></div>
      <div class="ln" style="width: 44%;"></div><div class="ln" style="width: 73%;"></div>
      <div class="ln" style="width: 66%;"></div><div class="ln" style="width: 30%;"></div>
      <div class="ln" style="width: 78%;"></div><div class="ln" style="width: 52%;"></div>
    </div>
  </div>
  <div class="win" style="left: 620px; top: 230px; width: 640px; height: 460px;">
    <div class="wbar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 10px;">
      <div class="ln" style="width: 40%; height: 12px;"></div>
      <div class="ln" style="width: 88%;"></div><div class="ln" style="width: 70%;"></div>
      <div class="ln" style="width: 83%;"></div><div class="ln" style="width: 47%;"></div>
    </div>
  </div>

  <!-- barely dimmed: the work stays legible. that is C's bet, and C's risk. -->
  <div style="position: absolute; left: 0; top: 24px; right: 0; bottom: 0; background: rgba(22,26,32,0.20);"></div>

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 24px; background: rgba(247,248,250,0.72); backdrop-filter: blur(28px); display: flex; align-items: center; padding: 0 12px 0 14px; z-index: 5;">
    <div style="display: flex; align-items: center; gap: 17px;">
      <span style="font-size: 13px; font-weight: 700; color: #1c1f24; letter-spacing: -0.01em;">Finder</span>
      <span style="font-size: 13px; color: #1c1f24;">File</span>
      <span style="font-size: 13px; color: #1c1f24;">Edit</span>
      <span style="font-size: 13px; color: #1c1f24;">View</span>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 13px;">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="5" y="5" width="6" height="1.6" rx="0.8" fill="#1c1f24"></rect>
        <rect x="1.5" y="9.4" width="13" height="1.6" rx="0.8" fill="#1c1f24"></rect>
      </svg>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2a8.6 8.6 0 0 1 12 0M4.4 8.9a5.2 5.2 0 0 1 7.2 0M8 12.2h.01" stroke="#1c1f24" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>
      <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><rect x="1.4" y="4.4" width="18" height="8.2" rx="2.6" stroke="#1c1f24" stroke-width="1.2" fill="none"></rect><rect x="3.2" y="6.2" width="12" height="4.6" rx="1.2" fill="#1c1f24"></rect><path d="M21.2 7.2v2.4" stroke="#1c1f24" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="font-size: 13px; color: #1c1f24; font-variant-numeric: tabular-nums;">Tue 2:41 PM</span>
    </div>
  </div>

  <div class="hud" style="right: 44px; bottom: 44px; width: 452px; padding: 18px 20px 16px;">
    <div style="display: flex; align-items: baseline;">
      <span class="sc-l">Visual reset</span>
      <span style="margin-left: auto; font-size: 15px; color: #1c1f24; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;">0:12</span>
    </div>

    <div style="margin-top: 14px; font-size: 21px; font-weight: 400; letter-spacing: -0.016em; color: #14171c; line-height: 1.28;">
      Look at something comfortably far away.
    </div>
    <div style="margin-top: 8px; font-size: 13px; line-height: 1.5; color: #767d87;">
      Let the small details come into view without forcing focus. Blink slowly two or three times.
    </div>

    <div class="sc-t" style="margin-top: 18px;"><i style="width: 40%;"></i></div>

    <div style="margin-top: 16px; display: flex; align-items: center; gap: 9px;">
      <span style="font-size: 13px; color: #4a515b;">Skip</span>
      <span class="kc">esc</span>
      <span style="margin-left: auto; font-size: 11.5px; color: #969ca5;">Nothing is blocked.</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

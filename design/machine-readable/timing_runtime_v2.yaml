      paused: [release_corridor, terminal_provisional]
      snoozed: [release_corridor, held, paused, terminal_provisional]
      release_corridor: [visual_offered, movement_offered, position_offered, recovery_offered, merged_visual_offered, held, paused, terminal_provisional]
      terminal_provisional: [closed]
      closed: []
    terminal_slots:
      standalone: opportunity_close
      merged_visual_segment: visual_segment
      merged_opportunity: opportunity_close
    rule: >-
      A transition must use its registered source phase, opportunity kind, base participant
      set, segment, affected-nonparticipant references, and required payload. Paused/Held
      evidence is orthogonal to running phases. A phase reached only because of a
      provisional candidate is replayed if that candidate later loses reconciliation.
  nonterminal_reconciliation:
    rule: >-
      Effect-bearing nonterminal actions never form a distributed callback race. The
      authoritative coordinator validates one causal frontier, partitions eligible commands by
      conflict key, selects one winner per key, and applies every mutually compatible key winner
      in canonical key order within one transaction. Only commands that address the same evidence
      record or mutually exclusive opportunity intent compete. Arrival order is never an input.
      The transaction then reduces the complete Paused/Held evidence set and acknowledges one
      successor global revision plus any atomically fenced opportunity revision.
    opportunity_action_frontier:
      scope: one_opportunity_id_projection_epoch_and_opportunity_revision
      admission: >-
        Before class-specific materialization, admit every causally eligible effect-bearing
        nonterminal and terminal candidate originated under the same live lease, generation,
        projection epoch, phase, segment ID, and revision. The frontier closes at its coordinator
        settlement deadline; callback arrival order is never an input.
      settlement: >-
        The signed projection lease carries one coordinator-monotonic admission cutoff. The
        coordinator settles after every live projection causally acknowledges the frontier or at
        that fixed cutoff, whichever occurs first. A candidate is eligible only if its signed
        origin ticks precede the cutoff and it arrives inside the retained settlement window. No
        product fact, accepted deadline, authority transfer, haptic, or running projection is
        externally exposed before settlement. The pending surface is the only pre-settlement UI.
      covers:
        - merged_movement_offered_start_5_vs_start_2_vs_explicit_skip_or_escape
        - running_take_with_me_vs_any_terminal_control
        - every_other_effect_bearing_nonterminal_vs_terminal_candidate_for_the_same_opportunity_revision
      winner_sort:
        - causally_satisfied_exact_scope_phase_segment_and_lease
        - smallest_registered_opportunity_intent_rank
        - lexicographically_smallest_action_id
      registered_opportunity_intent_rank:
        explicit_skip_or_escape_terminal: 0
        other_terminal: 10
        take_with_me_handoff: 20
        merged_start_5: 30
        merged_start_2: 31
        other_effect_bearing_nonterminal: 40
      commit_order:
        - choose_exactly_one_winner_for_each_mutually_exclusive_opportunity_intent_key
        - materialize_only_the_winning_concrete_transition_and_its_registered_resolver
        - commit_at_most_one_product_fact_and_one_clock_effect_set_for_that_frontier
        - advance_the_opportunity_revision_and_revoke_the_predecessor_lease
        - reject_every_loser_against_the_successor_revision_with_a_truthful_operational_receipt
      handoff_rule: >-
        A terminal action that wins cannot be followed by authority transfer. A Take with me that
        wins binds its exact receiver and advances the opportunity revision before transfer; any
        predecessor-revision terminal loses. There is no orphan breakStarted, deadline, or fact.
      arrival_order_traces:
        start_then_skip: {inputs: [companion.merged.movement_start_5, companion.merged.movement_skip], winner: companion.merged.movement_skip, fact_history: [skipped], resulting_phase: terminal_provisional}
        skip_then_start: {inputs: [companion.merged.movement_skip, companion.merged.movement_start_5], canonicalized_inputs: [companion.merged.movement_start_5, companion.merged.movement_skip], winner: companion.merged.movement_skip, fact_history: [skipped], resulting_phase: terminal_provisional}
        escape_then_start: {inputs: [merged.escape_during_movement, companion.merged.movement_start_5], winner: merged.escape_during_movement, fact_history: [skipped], resulting_phase: terminal_provisional}
        start_then_escape: {inputs: [companion.merged.movement_start_5, merged.escape_during_movement], winner: merged.escape_during_movement, fact_history: [skipped], resulting_phase: terminal_provisional}
        start_2_then_skip: {inputs: [companion.merged.movement_start_2, companion.merged.movement_skip], winner: companion.merged.movement_skip, fact_history: [skipped], resulting_phase: terminal_provisional}
        skip_then_start_2: {inputs: [companion.merged.movement_skip, companion.merged.movement_start_2], winner: companion.merged.movement_skip, fact_history: [skipped], resulting_phase: terminal_provisional}
        start_5_then_start_2: {inputs: [companion.merged.movement_start_5, companion.merged.movement_start_2], winner: companion.merged.movement_start_5, fact_history: [breakStarted], resulting_phase: merged_movement_running}
        start_2_then_start_5: {inputs: [companion.merged.movement_start_2, companion.merged.movement_start_5], winner: companion.merged.movement_start_5, fact_history: [breakStarted], resulting_phase: merged_movement_running}
        handoff_then_done: {inputs: [companion.take_with_me_request, companion.merged.movement_done_early], winner: companion.merged.movement_done_early, fact_history: [userDeclaredCompleted], resulting_phase: terminal_provisional}
        done_then_handoff: {inputs: [companion.merged.movement_done_early, companion.take_with_me_request], winner: companion.merged.movement_done_early, fact_history: [userDeclaredCompleted], resulting_phase: terminal_provisional}

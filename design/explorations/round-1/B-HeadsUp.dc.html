<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .qb { height: 28px; padding: 0 14px; border-radius: 7px; display: inline-flex; align-items: center; font-size: 13px; }
  </style>
</helmet>
<div style="position: relative; width: 720px; height: 560px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; inset: 0; background: linear-gradient(168deg, #9a97ab 0%, #7e7c92 48%, #5f5e70 100%);"></div>

  <div style="position: absolute; left: 44px; top: 96px; width: 470px; height: 400px; border-radius: 10px; background: #fbfbfc; box-shadow: 0 22px 48px rgba(28,25,36,0.32); overflow: hidden;">
    <div style="height: 34px; background: #f0eff3; border-bottom: 1px solid #e0dee5; display: flex; align-items: center; padding: 0 12px; gap: 7px;">
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d5d3dc;"></div>
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d5d3dc;"></div>
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d5d3dc;"></div>
    </div>
    <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 9px;">
      <div style="height: 8px; width: 62%; border-radius: 2px; background: #e6e4ec;"></div>
      <div style="height: 8px; width: 84%; border-radius: 2px; background: #ecebf1;"></div>
      <div style="height: 8px; width: 47%; border-radius: 2px; background: #ecebf1;"></div>
      <div style="height: 8px; width: 76%; border-radius: 2px; background: #e6e4ec;"></div>
      <div style="height: 8px; width: 33%; border-radius: 2px; background: #ecebf1;"></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 24px; background: rgba(248,247,250,0.72); backdrop-filter: blur(28px); display: flex; align-items: center; padding: 0 12px 0 14px;">
    <div style="display: flex; align-items: center; gap: 17px;">
      <span style="font-size: 13px; font-weight: 700; color: #201f24; letter-spacing: -0.01em;">Finder</span>
      <span style="font-size: 13px; color: #201f24;">File</span>
      <span style="font-size: 13px; color: #201f24;">Edit</span>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 13px;">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="5" y="5" width="6" height="1.6" rx="0.8" fill="#201f24"></rect>
        <rect x="1.5" y="9.4" width="13" height="1.6" rx="0.8" fill="#201f24"></rect>
      </svg>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2a8.6 8.6 0 0 1 12 0M4.4 8.9a5.2 5.2 0 0 1 7.2 0M8 12.2h.01" stroke="#201f24" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>
      <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><rect x="1.4" y="4.4" width="18" height="8.2" rx="2.6" stroke="#201f24" stroke-width="1.2" fill="none"></rect><rect x="3.2" y="6.2" width="12" height="4.6" rx="1.2" fill="#201f24"></rect><path d="M21.2 7.2v2.4" stroke="#201f24" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="font-size: 13px; color: #201f24; font-variant-numeric: tabular-nums;">Tue 2:41 PM</span>
    </div>
  </div>

  <!-- heads-up: a small band, the same shape the break will take -->
  <div style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 40px; width: 560px; height: 60px; border-radius: 13px; background: rgba(250,249,252,0.92); backdrop-filter: blur(46px); border: 0.5px solid rgba(60,54,78,0.14); box-shadow: 0 14px 40px rgba(28,24,36,0.30), 0 1px 3px rgba(28,24,36,0.14); display: flex; align-items: center; padding: 0 16px;">

    <div style="width: 3px; height: 30px; border-radius: 2px; background: #8d6b96; flex: none;"></div>

    <div style="margin-left: 14px; min-width: 0;">
      <div style="font-size: 13px; font-weight: 600; color: #201f24; letter-spacing: -0.005em;">Visual reset in a moment</div>
      <div style="font-size: 12.5px; color: #6f6b79; margin-top: 1px;">A short break from near focus.</div>
    </div>

    <div style="margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none;">
      <span class="qb" style="color: #4a4655;">In 5 min</span>
      <span class="qb" style="background: #8d6b96; color: #fff; font-weight: 500;">Start now</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

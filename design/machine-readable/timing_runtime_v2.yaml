terminal_reconciliation:
  terminal_fact_id:
    algorithm: sha256_over_cadence_contract_bytes_v1
    inputs:
      - domain_literal_terminal_fact_v2
      - opportunity_id
      - canonical_terminal_slot
      - fixed_registered_component_scope_for_that_slot
    fixed_registered_component_scope:
      standalone_opportunity_close: registered_base_participant_set_from_opportunity_creation
      merged_visual_segment: [visual]
      merged_opportunity_close: [visual, movement]
    invariant: >-
      Candidate action kind, winner, claimed participant subset, affected nonparticipant,
      device, timing, and arrival metadata are never ID inputs. Every valid candidate for
      one OpportunityID and canonical terminal slot therefore upserts the same fact ID.
    encoding: identities.portable_canonical_encoding
  valid_candidate_requires:
    - exact_opportunity_id
    - exact_participating_clock_cycle_ids
    - registered_source_phase_opportunity_kind_participants_segment_and_payload
    - unique_action_id
    - origin_device_id_session_id_and_persistent_device_counter
    - origin_opportunity_revision_and_phase
    - origin_segment_id_and_terminal_slot
    - causal_parent_action_ids
    - actor_had_not_observed_a_terminal_revision_at_origin
    - live_terminal_projection_lease_at_monotonic_origin
    - causal_ack_of_the_projected_opportunity_revision
    - exact_current_coordinator_generation
    - exact_current_unfenced_opportunity_projection_epoch_id
  originated_after_known_closure: operational_expired_before_acceptance_show_current_projected_state
  arrived_after_provisional_closure_but_valid_at_origin: include_only_if_same_live_unfenced_coordinator_generation_and_projection_epoch
  arrived_after_generation_or_projection_epoch_fence: operational_rejected_no_op_with_user_visible_receipt
  terminal_claim_rank_smallest_wins:
    skipped: 0
    snoozed: 5
    notAppropriate: 10
    positionChanged: 20
    userDeclaredAlreadyMoved: 30
    userDeclaredCompleted: 40
    timerFinished: 50
  winner_sort_key:
    - smallest_terminal_claim_rank
    - lexicographically_smallest_registered_action_kind
    - lexicographically_smallest_origin_device_id
    - smallest_origin_device_counter
    - lexicographically_smallest_action_id
  rules:
    - reduction_is_commutative_associative_and_idempotent
    - arrival_order_never_selects_the_winner
    - the_same_candidate_set_produces_the_same_winner_on_every_device
    - projections_close_immediately_on_a_valid_local_candidate
    - a_later_winning_candidate_updates_the_same_terminal_fact_projection_not_a_second_fact
    - losing_and_duplicate_candidates_are_class_0_ephemeral_and_erased_at_settlement_or_fence
    - unknown_or_mismatched_candidates_fail_closed
    - unsynchronized_wall_time_remaining_duration_and_segment_duration_never_rank_candidates
    - no_new_candidate_can_originate_after_projection_lease_expiry_without_online_renewal
    - settlement_waits_for_every_projection_lease_to_be_acknowledged_revoked_or_monotonically_expired
    - valid_late_means_same_live_generation_only_and_never_survives_an_explicit_generation_fence
    - old_generation_arrivals_receive_an_operational_rejected_no_op_receipt_and_never_a_product_fact
    - every_terminal_or_operational_closure_commits_a_signed_high_water_projection_epoch_fence_before_successor_eligibility
    - raw_candidate_retention_is_memory_only_and_at_most_90_seconds
    - settled_predecessor_actions_can_never_mutate_a_successor_cycle
    - duplicate_action_id_replays_the_original_receipt_or_truthful_high_water_settlement_without_reapplying_effects
  rebase_contract:
    snapshot_scope_rule: >-
      Before any action in a terminal candidate set can expose effects, retain a snapshot
      whose clock scope equals the union of every clock named by every eligible candidate's
      clock effects, including affected nonparticipants and cross-clock restore/fresh rules.
      The conservative registered scope is all four visual, movement, position, and
      recovery clocks, including the latent manual position cycle while its reminders are
      disabled. A validator derives this effect closure from guards and transitions;
      a missing clock, cycle identity, or phase makes the opportunity invalid to project.
    retained_preterminal_snapshot_requires:
      - opportunity_id_revision_phase_and_active_segment
      - all_four_visual_movement_position_and_recovery_clock_cycle_ids_including_latent_manual_position
      - all_four_clock_accumulated_time_due_state_eligibility_phase_and_enablement
      - recovery_deferral_load_and_session_offer_state
      - existing_component_fact_projections
      - accepted_deadline_and_handoff_state
      - scheduling_decision_chain
      - active_evidence_records_and_reduction_revision
      - opportunity_offer_checkpoint_and_action_origin_checkpoint
    offered_and_running_checkpoints:
      offered_terminal_action: >-
        Project from the action-origin checkpoint after all valid offer-time accrual. Never
        restore a pre-ritual snapshot because no accepted ritual exists.
      accepted_running_terminal_action: >-
        Project from the snapshot taken atomically at acceptance after offer-time accrual and
        before the clocks freeze. restore_pre_ritual refers only to this checkpoint.
      merged_component_action: >-
        The independently final visual component projection and its post-component checkpoint
        remain in scope; a later movement winner cannot discard the fresh visual effect.
    postterminal_inputs_retained_until_settlement:
      - idempotent_eligible_interval_records
      - later_schedule_actions_and_decisions_with_causal_parents
      - minimized_companion_candidate_inputs_and_acknowledgements_until_settlement_only
    apply_rule: >-
      Terminal clock state is a pure projection of the retained preterminal snapshot plus
      the selected winner. If a late valid candidate becomes winner, atomically restore
      the snapshot, apply the new winner exactly once, keep already-final independent
      merged-component effects, discard descendants whose causal parent was the losing
      provisional branch, and deterministically replay the retained idempotent
      postterminal inputs against the replacement cycles.
    fact_rule: >-
      Upsert the same deterministic terminal fact ID and projection revision. Never append
      a second terminal fact, repeat an accessibility announcement, notification, haptic,
      or other external side effect. Raw losing and duplicate candidates are erased from
      Class-0 memory at settlement or fence and never become a retained ledger row.

product_facts:
  closed_vocabulary:
    - promptPresented
    - breakStarted
    - timerFinished
    - userDeclaredCompleted
    - userDeclaredAlreadyMoved
    - positionChanged
    - snoozed
    - skipped
    - notAppropriate
    - likelyNaturalInterruption
  rule: >-
    These facts say what the product showed, timed, or the user selected. They are
    never merged into healthy-break, verified-movement, compliance, or outcome facts.
  record_contract:
    nonterminal_fact_id: deterministic_hash_of_action_id_fact_type_and_participating_cycle_ids
    terminal_fact_id: terminal_reconciliation_terminal_fact_id_for_terminal_and_component_terminal_candidate_resolvers
    required:
      - fact_type
      - opportunity_id_or_idle_episode_id
      - participating_clock_cycle_ids
      - action_id
      - recorded_at_utc
      - origin_device_id
      - origin_session_id
      - origin_revision
    rule: >-
      One action emits at most one product fact. Participant cycle IDs carry merged
      scope. A fact reports only the named product occurrence and never proves a
      physical behavior, completion quality, symptom change, or health outcome.
  separate_ledgers:
    - operational
    - observation
    - assessment
    - scheduling_decision
    - correction
    - companion_action
  candidate_data_lifecycle:
    class: class_0_ephemeral_operational_state
    applies_to:
      - raw_terminal_candidate_envelopes
      - losing_candidates
      - duplicate_candidates
      - post_fence_rejected_action_envelopes
    location: memory_only
    maximum_retention_seconds: 90
    discard_when: settlement_generation_fence_or_projection_epoch_fence_whichever_occurs_first
    export: never
    persistence: prohibited
    analytics: prohibited
    stable_record_identity: none
    action_id_handling: transient_protocol_correlation_only_erased_with_the_buffer
    retained_boundary: >-
      Only the winning ten-fact projection, current Class-1 coordinator generation/high-water
      continuity state, and a compact Class-0 replay receipt may survive raw-payload reduction.
      No raw candidate payload or losing/duplicate audit row enters companion_action,
      operational history, export, Weekly, analytics, or another durable store.
    compact_replay_receipt:
      fields: action_id_digest_device_counter_outcome_code_successor_revisions_and_ack_code_only
      location: memory_only
      maximum_retention_seconds: 90
      discard_when: acknowledgement_projection_fence_or_90_seconds_whichever_occurs_first
      purpose: replay_lost_ack_without_reapplying_effects
      prohibited: [raw_payload, user_content, product_fact, health_fact, durable_identity, export, analytics]

companion_contract:
  capability_boundary: optional_local_paired_device_transport_no_sensor_or_health_data_required
  live_scope_rule: >-
    “Any device” means only a paired device holding a live lease for the exact GlobalStateID,
    coordinator generation, OpportunityID, projection epoch, revision, and segment. Offline,
    expired, fenced, mismatched, or unacknowledged projections cannot affect the timer.
  state_registry:
    control_catalog:
      take_with_me: {label: Take with me, action: companion.take_with_me}
      done_early: {label: Done early, action_group: normalized_phase_specific_done_early}
      already_moved: {label: I already moved, action_group: normalized_phase_specific_already_moved}
      change_position: {label: Change position, action_group: normalized_phase_specific_position_changed}
      visual_only: {label: Just the visual one, action_group: companion.merged.visual_only}
      skip: {label: Skip, action_group: normalized_phase_specific_skip_or_escape}
      retry: {label: Retry, action: revalidate_or_retry_transfer}
      close: {label: Close, action: dismiss_companion_status_only}
      cancel_transfer: {label: Cancel transfer, action: cancel_uncommitted_transfer}
      cancel_revalidation: {label: Cancel reconnect, action: cancel_revalidation}
    states:
      live:
        visible_status: Ready on this device
        voiceover_announcement: Timer controls are live on this device.
        control_ids: [take_with_me, done_early, already_moved, change_position, visual_only, skip]
        enabled_rule: >-
          Take with me is enabled for a transferable running deadline. A terminal control is
          present and enabled only when its normalized concrete transition guard matches the
          current phase; unavailable controls are absent, not disabled focus targets.
        focus_target: take_with_me_if_present_else_first_present_terminal_control
        focus_order: [take_with_me, done_early, already_moved, change_position, visual_only, skip]
        keyboard: {return_space: activate_focused_enabled_control, escape_command_period: dismiss_status_only}
        cancellation: escape_never_cancels_or_finishes_the_authoritative_timer
      offline:
        visible_status: Device offline. Keep using this Mac.
        voiceover_announcement: Device offline. No action was applied. Retry or close.
        control_ids: [retry, close]
        enabled_rule: retry_and_close_enabled
        focus_target: retry
        focus_order: [retry, close]
        keyboard: {return_space: activate_focused_enabled_control, escape_command_period: close}
        cancellation: close_dismisses_status_and_the_mac_timer_remains_authoritative
      expired:
        visible_status: Session expired. Reconnect to continue.
        voiceover_announcement: Session expired. Timer controls are unavailable. Retry or close.
        control_ids: [retry, close]
        enabled_rule: retry_and_close_enabled
        focus_target: retry
        focus_order: [retry, close]
        keyboard: {return_space: activate_focused_enabled_control, escape_command_period: close}
        cancellation: close_dismisses_status_without_changing_the_timer
      transfer_pending:
        visible_status: Sending timer…
        voiceover_announcement: Sending timer. Cancel transfer is available.
        control_ids: [cancel_transfer]
        enabled_rule: cancel_transfer_enabled_until_handoff_commit
        focus_target: cancel_transfer
        focus_order: [cancel_transfer]
        keyboard: {return_space: cancel_transfer, escape_command_period: cancel_transfer}
        cancellation: cancel_only_the_uncommitted_transfer_and_keep_the_mac_timer_authoritative
      terminal_action_pending:
        visible_status_template: Sending “%{selected_action_label}”…
        voiceover_template: Sending %{selected_action_label}. The submitted action cannot be cancelled.
        control_ids: [close]
        enabled_rule: close_enabled
        focus_target: close
        focus_order: [close]
        keyboard: {return_space: close, escape_command_period: close}
        cancellation: close_dismisses_status_but_does_not_cancel_or_repeat_the_submitted_action
      revalidating:
        visible_status: Reconnecting…
        voiceover_announcement: Reconnecting. No action has been applied yet. Cancel reconnect or close.
        control_ids: [cancel_revalidation, close]
        enabled_rule: cancel_revalidation_and_close_enabled
        focus_target: cancel_revalidation
        focus_order: [cancel_revalidation, close]
        keyboard: {return_space: activate_focused_enabled_control, escape_command_period: cancel_revalidation}
        cancellation: cancel_revalidation_only_then_show_the_current_authoritative_device
      rejected_no_op:
        visible_status: That action no longer applies. Showing the current timer.
        voiceover_announcement: Action not applied. Showing the current timer. Close.
        control_ids: [close]
        enabled_rule: close_enabled
        focus_target: close
        focus_order: [close]
        keyboard: {return_space: close, escape_command_period: close}
        cancellation: close_dismisses_the_receipt_only
      already_ended:
        visible_status: Ended on another device.
        voiceover_announcement: This timer already ended on another device. Close.
        control_ids: [close]
        enabled_rule: close_enabled
        focus_target: close
        focus_order: [close]
        keyboard: {return_space: close, escape_command_period: close}
        cancellation: close_dismisses_the_receipt_only
      transfer_failed:
        visible_status: Couldn’t transfer. The timer is still running on this Mac.
        voiceover_announcement: Transfer failed. The timer is still running on this Mac. Retry or close.
        control_ids: [retry, close]
        enabled_rule: retry_and_close_enabled
        focus_target: retry
        focus_order: [retry, close]
        keyboard: {return_space: activate_focused_enabled_control, escape_command_period: close}
        cancellation: close_keeps_the_mac_timer_authoritative_retry_starts_a_new_transfer_attempt
    parity_rule: >-
      Every control ID resolves in control_catalog; every focus target is enabled in that state;
      focus order contains exactly the available controls; no disabled trigger receives focus.
      State transitions announce once and never silently apply or discard an action.
  sensor_free_fallback: >-
    Every state remains usable without HealthKit, motion, location, camera, or another sensor.
    The authoritative Mac/current-device timer and ordinary manual terminal controls remain the
    fallback; missing companion evidence is unknown and creates no completion or health fact.

timer_recovery_user_projection:
  localization_keys:
    title: timer_recovery.title
    due_body: timer_recovery.due.body
    due_voiceover: timer_recovery.due.voiceover
    due_menu_status: timer_recovery.due.menu_status
    not_due_body: timer_recovery.not_due.body
    not_due_voiceover: timer_recovery.not_due.voiceover
    actual_phase_menu_status: timer_recovery.actual_phase.menu_status
    close_action: timer_recovery.close
  exact_copy:
    title: Timer couldn’t be restored
    close_action: Close
    due:
      body: No finish was recorded. This schedule is still due.
      voiceover: Timer could not be restored. No finish was recorded. The schedule is still due.
      menu_status: Still due · timer not restored
    not_due_or_manual_early:
      body: No finish was recorded. The timer was not restored, and this schedule was not reset.
      voiceover: Timer could not be restored. No finish was recorded. This schedule was not reset.
      menu_status_template: "%{actual_schedule_status} · timer not restored"
  phase_selection_rule: >-
    Read the retained preterminal schedule snapshot after settling any independent component.
    Use due copy only when that affected schedule is actually soft-due, heads-up, held-due, or
    overdue. For an accumulating or manually opened early ritual, use not-due copy and format the
    menu with the actual current schedule phase; never label a not-due schedule still due.
  interaction:
    initial_focus: close_action
    keyboard: {close: [return, escape, command_period]}
    quiet_transition: close_unusable_ritual_then_60_second_grace_before_normal_reoffer
    menu_rule: show_the_actual_retained_schedule_phase_during_grace_without_a_completion_mark
    failure_rule: fence_or_sync_failure_keeps_the_same_honest_copy_and_adds_retry_when_storage_recovers

input_and_motion:
  decision: D-032
  entrance: instant_final_field_no_global_tint_blur_or_compositor_transition
  countdown_start:
    visual: same_committed_open_action_as_break_started
    movement: only_now_accept_movement_or_merged_movement_accept_with_selected_duration
    recovery: only_now_accept_recovery_with_selected_duration
  break_started_emission:
    visual_or_merged_visual: emitted_atomically_when_the_immediately_running_visual_surface_opens
    movement: not_emitted_when_now_only_opens_movement_offered_emitted_on_5_or_2_minute_acceptance
    merged_movement: emitted_on_5_or_2_minute_acceptance_for_the_second_segment
  movement_acceptance:
    offered_state:
      timer_running: false
      done_early_present: false
      initial_focus: start_5_minutes
      focus_order: [start_5_minutes, start_2_minutes, already_moved, change_position, skip]
      controls_first_frame:
        start_5_minutes: {shortcut: [return, "5"], action: now.accept_movement, duration_seconds: 300}
        start_2_minutes: {shortcut: [q, "2"], action: now.accept_movement, duration_seconds: 120}
        already_moved: {shortcut: [a], action: movement.already_moved}
        change_position: {shortcut: [p], action: movement.position_changed_offered}
        skip: {shortcut: [escape, command_period], action: movement.escape_offered}
      voiceover_value: Movement opportunity. Choose five minutes or two minutes. Timer not started.
    running_state:
      timer_running: true
      selected_duration_required: true
      initial_focus: done_early
      focus_order: [walk_or_wheel, small_space, seated, done_early, already_moved, change_position, skip]
      controls_first_frame:
        walk_or_wheel: {shortcut: ["1"], action: movement.change_content}
        small_space: {shortcut: ["2"], action: movement.change_content}
        seated: {shortcut: ["3"], action: movement.change_content}
        done_early: {shortcut: [return], action: movement.done_early}
        already_moved: {shortcut: [a], action: movement.already_moved}
        change_position: {shortcut: [p], action: movement.position_changed_running}
        skip: {shortcut: [escape, command_period], action: movement.escape_running}
      voiceover_value: Movement opportunity running for the selected duration.
    merged_offered_addition:
      visibility: merged_movement_offered_only
      focus_position: after_change_position_before_skip
      control: {id: just_the_visual_one, accessible_name: Just the visual one, shortcut: [v], action: merged.visual_only}
      first_frame: focusable_keyboard_and_pointer_action_with_no_animation_gate
    merged_rule: replace_movement_action_ids_with_merged_phase_specific_ids_and_keep_other_focus_copy_and_shortcuts
    voiceover_names:
      start_5_minutes: Start five minutes, Return or 5
      start_2_minutes: Start two minutes, Q or 2
      done_early: Done early, Return
      already_moved: I already moved, A
      change_position: Change position instead, P, logged separately
      just_the_visual_one: Just the visual one, V
      skip: Skip, Escape
    escape_rule: immediate_skipped_from_offered_or_running_never_requires_acceptance
  first_active_frame:
    - escape
    - command_period
    - return
    - movement_offered_shortcuts_5_2_q_a_p
    - movement_running_shortcuts_1_2_3_a_p
    - merged_movement_offered_shortcut_v
    - every_pointer_control
  exit: instant_then_restore_previous_application
  declaration_guard_seconds: 0
  rule: >-
    No entrance settlement callback or local animation gate may delay the accepted
    deadline, focus, Escape, Return, or another printed declaration shortcut. Movement
    Done early is absent until a duration acceptance commits `breakStarted`; the offered
    state's 5- and 2-minute controls and exits are first-frame actions instead.

activation:
  current_runtime: legacy_v1
  v2_contract_is_for_following_implementation_stories: true
  forbidden_until_runtime_migration:
    - claiming_new_preset_ids_are_selectable
    - claiming_pause_is_relaunch_durable
    - claiming_cross_device_reconciliation_is_shipped
    - claiming_sensor_schedule_restart_is_shipped
    - claiming_d032_is_fully_implemented

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .mi { display: flex; align-items: center; height: 22px; padding: 0 10px 0 22px; font-size: 13px; color: #1c1f24; position: relative; }
    .mi .sc { margin-left: auto; color: #858c96; font-size: 13px; padding-left: 24px; }
    .sep { height: 1px; background: #dcdfe4; margin: 5px 10px; }
    .sc-l { font-size: 9.5px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase; color: #858c96; }
    .val { font-size: 12.5px; color: #1c1f24; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    /* tick scale: precise, static, readable in grayscale by fill length */
    .sc-t { height: 9px; background-image: repeating-linear-gradient(to right, rgba(90,100,115,0.28) 0 1px, transparent 1px 5px); }
    .sc-t > i { display: block; height: 9px; background-image: repeating-linear-gradient(to right, #4d6b93 0 1px, transparent 1px 5px); }
  </style>
</helmet>
<div style="position: relative; width: 720px; height: 560px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; inset: 0; background: linear-gradient(168deg, #a3a8ae 0%, #868c95 48%, #676d76 100%);"></div>

  <div style="position: absolute; left: 44px; top: 96px; width: 470px; height: 400px; border-radius: 10px; background: #fbfbfc; box-shadow: 0 22px 48px rgba(24,28,34,0.32); overflow: hidden;">
    <div style="height: 34px; background: #f0f1f3; border-bottom: 1px solid #e0e2e6; display: flex; align-items: center; padding: 0 12px; gap: 7px;">
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d4d7dc;"></div>
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d4d7dc;"></div>
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d4d7dc;"></div>
    </div>
    <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 9px;">
      <div style="height: 8px; width: 62%; border-radius: 2px; background: #e6e8ec;"></div>
      <div style="height: 8px; width: 84%; border-radius: 2px; background: #eceef1;"></div>
      <div style="height: 8px; width: 47%; border-radius: 2px; background: #eceef1;"></div>
      <div style="height: 8px; width: 76%; border-radius: 2px; background: #e6e8ec;"></div>
      <div style="height: 8px; width: 33%; border-radius: 2px; background: #eceef1;"></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 24px; background: rgba(247,248,250,0.72); backdrop-filter: blur(28px); display: flex; align-items: center; padding: 0 12px 0 14px;">
    <div style="display: flex; align-items: center; gap: 17px;">
      <span style="font-size: 13px; font-weight: 700; color: #1c1f24; letter-spacing: -0.01em;">Finder</span>
      <span style="font-size: 13px; color: #1c1f24;">File</span>
      <span style="font-size: 13px; color: #1c1f24;">Edit</span>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
      <div style="height: 22px; padding: 0 7px; border-radius: 5px; background: rgba(34,38,44,0.86); display: flex; align-items: center;">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5" y="5" width="6" height="1.6" rx="0.8" fill="#f7f8fa"></rect>
          <rect x="1.5" y="9.4" width="13" height="1.6" rx="0.8" fill="#f7f8fa"></rect>
        </svg>
      </div>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2a8.6 8.6 0 0 1 12 0M4.4 8.9a5.2 5.2 0 0 1 7.2 0M8 12.2h.01" stroke="#1c1f24" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>
      <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><rect x="1.4" y="4.4" width="18" height="8.2" rx="2.6" stroke="#1c1f24" stroke-width="1.2" fill="none"></rect><rect x="3.2" y="6.2" width="12" height="4.6" rx="1.2" fill="#1c1f24"></rect><path d="M21.2 7.2v2.4" stroke="#1c1f24" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="font-size: 13px; color: #1c1f24; font-variant-numeric: tabular-nums;">Tue 2:41 PM</span>
    </div>
  </div>

  <div style="position: absolute; top: 27px; right: 96px; width: 286px; border-radius: 10px; background: rgba(249,250,251,0.94); backdrop-filter: blur(48px); border: 0.5px solid rgba(40,48,58,0.16); box-shadow: 0 18px 44px rgba(24,28,34,0.30), 0 1px 3px rgba(24,28,34,0.16); padding: 6px 0;">

    <div style="padding: 11px 14px 13px;">
      <div style="display: flex; align-items: baseline;">
        <span class="sc-l">Visual reset</span>
        <span class="val" style="margin-left: auto;">~9 min</span>
      </div>
      <div class="sc-t" style="margin-top: 6px;"><i style="width: 64%;"></i></div>

      <div style="display: flex; align-items: baseline; margin-top: 15px;">
        <span class="sc-l">Movement</span>
        <span class="val" style="margin-left: auto;">~24 min</span>
      </div>
      <div class="sc-t" style="margin-top: 6px;"><i style="width: 41%;"></i></div>

      <div style="margin-top: 15px; padding-top: 11px; border-top: 1px solid #e3e6ea; display: flex; align-items: baseline;">
        <span class="sc-l">Estimated active use today</span>
        <span class="val" style="margin-left: auto;">1:03</span>
      </div>
    </div>

    <div class="sep"></div>
    <div class="mi">Start visual reset</div>
    <div class="mi">Start movement</div>
    <div class="sep"></div>
    <div class="mi">Pause<span class="sc"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M3.6 2.2L6.6 5l-3 2.8" stroke="#858c96" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="mi">
      <svg width="12" height="12" viewBox="0 0 12 12" style="position: absolute; left: 6px;"><path d="M2.4 6.2l2.3 2.3 4.9-5" stroke="#1c1f24" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Working hours only
    </div>
    <div class="sep"></div>
    <div class="mi">Weekly rhythm…</div>
    <div class="mi">Settings…<span class="sc">⌘,</span></div>
    <div class="sep"></div>
    <div class="mi">Quit Cadence<span class="sc">⌘Q</span></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

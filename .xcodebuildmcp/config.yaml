# XcodeBuildMCP project config: optional macOS session defaults.
# Shell scripts are the blessed verification loop; MCP is available for deeper
# build/run/debug or Xcode integration when a session needs it.
schemaVersion: 1
sentryDisabled: true

enabledWorkflows:
  - macos
  - debugging

sessionDefaults:
  projectPath: ./App.xcodeproj
  scheme: App

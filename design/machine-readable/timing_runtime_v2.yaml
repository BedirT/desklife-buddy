      nonterminal_action_pending:
        visible_status_template: Starting “%{selected_action_label}”…
        voiceover_template: Starting %{selected_action_label}. The submitted start cannot be cancelled or repeated.
        preserved_provenance: [selected_action_id, selected_action_label, action_id_digest, origin_phase_and_segment, expected_running_target_phase]
        control_ids: [close]
        enabled_rule: close_enabled
        focus_target: close
        focus_order: [close]
        keyboard: {return_space: close, escape_command_period: dismiss_status_only}
        cancellation: close_dismisses_status_but_does_not_cancel_or_repeat_the_submitted_start
      revalidating:
        visible_status: Reconnecting…
        voiceover_announcement: Reconnecting. No companion operation is pending. Cancel reconnect or close.
        control_ids: [cancel_revalidation, close]
        enabled_rule: cancel_revalidation_and_close_enabled
        focus_target: cancel_revalidation
        focus_order: [cancel_revalidation, close]
        keyboard: {return_space: activate_focused_enabled_control, escape_command_period: dismiss_status_only}
        cancellation: cancel_revalidation_only_then_show_the_current_authoritative_device
      revalidating_terminal_ack_unknown:
        visible_status_template: Checking whether “%{selected_action_label}” was received; do not repeat.
        voiceover_template: Checking whether %{selected_action_label} was received. Do not repeat the action. Cancel reconnect or close.
        preserved_provenance: [selected_action_id, selected_action_label, action_id_digest, origin_phase_and_segment, acknowledgement_unknown]
        control_ids: [cancel_revalidation, close]
        enabled_rule: cancel_revalidation_and_close_enabled_neither_repeats_the_action
        focus_target: cancel_revalidation
        focus_order: [cancel_revalidation, close]
        keyboard: {return_space: cancel_revalidation, escape_command_period: dismiss_status_only}
        cancellation: cancel_only_the_status_check_then_show_current_authoritative_state_without_repeating
      revalidating_nonterminal_ack_unknown:
        visible_status_template: Checking whether “%{selected_action_label}” started; do not repeat.
        voiceover_template: Checking whether %{selected_action_label} started. Do not repeat the action. Cancel reconnect or close.
        preserved_provenance: [selected_action_id, selected_action_label, action_id_digest, origin_phase_and_segment, expected_running_target_phase, acknowledgement_unknown]
        control_ids: [cancel_revalidation, close]
        enabled_rule: cancel_revalidation_and_close_enabled_neither_repeats_the_start
        focus_target: cancel_revalidation
        focus_order: [cancel_revalidation, close]
        keyboard: {return_space: cancel_revalidation, escape_command_period: dismiss_status_only}
        cancellation: cancel_only_the_status_check_then_show_current_authoritative_state_without_repeating
      rejected_no_op:
        visible_status: That action no longer applies. Showing the current timer.
        voiceover_announcement: Action not applied. Showing the current timer. Close.
        control_ids: [close]
        enabled_rule: close_enabled
        focus_target: close
        focus_order: [close]
        keyboard: {return_space: close, escape_command_period: dismiss_status_only}
        cancellation: close_dismisses_the_receipt_only
      already_ended:
        visible_status: Ended on another device.
        voiceover_announcement: This timer already ended on another device. Close.
        control_ids: [close]
        enabled_rule: close_enabled
        focus_target: close
        focus_order: [close]
        keyboard: {return_space: close, escape_command_period: dismiss_status_only}
        cancellation: close_dismisses_the_receipt_only
      transfer_failed:
        visible_status: Couldn’t transfer. The timer is still running on this Mac.
        voiceover_announcement: Transfer failed. The timer is still running on this Mac. Retry or close.
        control_ids: [retry, close]
        enabled_rule: retry_and_close_enabled
        focus_target: retry
        focus_order: [retry, close]
        keyboard: {return_space: activate_focused_enabled_control, escape_command_period: dismiss_status_only}
        cancellation: close_keeps_the_mac_timer_authoritative_retry_starts_a_new_transfer_attempt
    operational_state_transitions:
      live.take_with_me: {target: transfer_pending, ledger: companion_action_and_operational, product_fact: none}
      live.terminal_control: {target: terminal_action_pending, ledger: operational_pending_only_until_concrete_action_commits, product_fact: derived_only_from_normalized_concrete_transition}
      live.nonterminal_action: {target: nonterminal_action_pending, applies_to: [companion.merged.movement_start_5, companion.merged.movement_start_2], ledger: operational_pending_only_until_concrete_action_commits, product_fact: breakStarted_only_from_normalized_merged_movement_accept_outcome}
      live.connectivity_lost_without_pending_operation: {target: offline, ledger: operational, product_fact: none}
      live.connectivity_lost_with_terminal_ack_unknown: {target: offline_terminal_ack_unknown, ledger: operational, product_fact: none}
      live.connectivity_lost_with_nonterminal_ack_unknown: {target: offline_nonterminal_ack_unknown, ledger: operational, product_fact: none}
      offline.retry: {target: revalidating, ledger: operational, product_fact: none}
      offline_terminal_ack_unknown.check_status: {target: revalidating_terminal_ack_unknown, ledger: operational, product_fact: none, resend_selected_action: false}
      offline_nonterminal_ack_unknown.check_status: {target: revalidating_nonterminal_ack_unknown, ledger: operational, product_fact: none, resend_selected_action: false}
      expired.retry: {target: revalidating, ledger: operational, product_fact: none}
      transfer_pending.cancel_transfer_before_commit: {target: live, ledger: companion_action_and_operational, product_fact: none}
      transfer_pending.handoff_acknowledged: {target: live, ledger: companion_action_and_operational, product_fact: none}
      transfer_pending.failed: {target: transfer_failed, ledger: operational, product_fact: none}
      terminal_action_pending.outcome_ack: {target: live_or_already_ended_or_rejected_no_op, ledger: concrete_transition_plus_operational_receipt, product_fact: concrete_transition_only}
      terminal_action_pending.connectivity_lost: {target: offline_terminal_ack_unknown, ledger: operational, product_fact: none}
      nonterminal_action_pending.outcome_ack: {target: merged_movement_running_or_rejected_no_op, ledger: concrete_transition_plus_operational_receipt, product_fact: breakStarted_exactly_once_only_for_committed_start}
      nonterminal_action_pending.connectivity_lost: {target: offline_nonterminal_ack_unknown, ledger: operational, product_fact: none}
      revalidating.cancel_revalidation: {target: dismiss_to_current_authoritative_device, ledger: operational, product_fact: none}
      revalidating.succeeded: {target: live, ledger: operational, product_fact: none}
      revalidating.failed: {target: offline_or_expired, ledger: operational, product_fact: none}
      revalidating_terminal_ack_unknown.cancel_revalidation: {target: dismiss_to_current_authoritative_device, ledger: operational, product_fact: none, resend_selected_action: false}
      revalidating_terminal_ack_unknown.known_outcome: {target: live_or_already_ended_or_rejected_no_op, ledger: operational_receipt, product_fact: never_replayed}
      revalidating_nonterminal_ack_unknown.cancel_revalidation: {target: dismiss_to_current_authoritative_device, ledger: operational, product_fact: none, resend_selected_action: false}
      revalidating_nonterminal_ack_unknown.known_outcome: {target: merged_movement_running_or_rejected_no_op, ledger: operational_receipt, product_fact: never_replayed_breakStarted_is_the_original_commit_only}
      every_state.escape_or_command_period: {target: dismiss_projection_only, ledger: none, product_fact: none, cancellation: none, remote_action: none}
    action_ack_provenance_lifecycle:
      applies_to: [terminal_action_pending, nonterminal_action_pending, offline_terminal_ack_unknown, offline_nonterminal_ack_unknown, revalidating_terminal_ack_unknown, revalidating_nonterminal_ack_unknown]
      preserved_fields: [selected_action_id, selected_action_label, action_id_digest, origin_phase_and_segment, expected_target_phase, coordinator_generation, opportunity_revision, acknowledgement_unknown]
      maximum_retention_seconds: 90
      storage: sender_crash_replay_outbox_only_when_needed_for_relaunch_otherwise_memory
      discard_at: valid_signed_acknowledgement_of_ack_or_90_monotonic_seconds_whichever_occurs_first
      expiry_projection: That action is too old to verify. Showing the current timer.
      prohibited: [automatic_resend_from_status_check, product_fact, health_fact, history, export, analytics, logs]
    parity_rule: >-
      Every control ID resolves in control_catalog; every focus target is enabled in that state;
      focus order contains exactly the available controls; no disabled trigger receives focus.
      State transitions announce once and never silently apply or discard an action.
    live_phase_parity_rule: >-
      The live projection selects exactly one registered phase row. Its controls and focus order
      are exact, every control action is a registered remote wrapper, Escape and Command-period
      dismiss only the local status projection and never emit a remote Skip or terminal action, every
      action group equals the closed required remote-ID set, and Just the visual one exists only
      for merged_movement_offered. No generic union action is inferred at runtime.
  sensor_free_fallback: >-
    Every state remains usable without HealthKit, motion, location, camera, or another sensor.
    The authoritative Mac/current-device timer and ordinary manual terminal controls remain the
    fallback; missing companion evidence is unknown and creates no completion or health fact.

timer_recovery_user_projection:
  localization_keys:
    title: timer_recovery.title
    due_body: timer_recovery.due.body
    due_voiceover: timer_recovery.due.voiceover
    not_due_body: timer_recovery.not_due.body
    not_due_voiceover: timer_recovery.not_due.voiceover
    actual_phase_menu_status: timer_recovery.actual_phase.menu_status
    paused_menu_status: timer_recovery.paused.menu_status
    held_menu_status: timer_recovery.held.menu_status
    close_action: timer_recovery.close
  exact_copy:
    title: Timer couldn’t be restored
    close_action: Close
    due:
      body: No finish was recorded. This schedule is still due.
      voiceover: Timer could not be restored. No finish was recorded. The schedule is still due.
    not_due_or_manual_early:
      body: No finish was recorded. The timer was not restored, and this schedule was not reset.
      voiceover: Timer could not be restored. No finish was recorded. This schedule was not reset.
    menu_status_by_projected_evidence:
      active_due: Still due · timer not restored
      active_not_due_template: "%{actual_schedule_status} · timer not restored"
      paused_due_template: "Paused: %{qualified_pause_reason} · timer not restored"
      paused_not_due_template: "Paused: %{qualified_pause_reason} · timer not restored"
      paused_hidden_system_reason: "Paused · timer not restored"
      held_due_template: "Held: %{qualified_hold_reason} · timer not restored"
      held_not_due_template: "Held: %{qualified_hold_reason} · timer not restored"
    paused_reason_registry:
      manual_pause:
        evidence: explicit_user_pause_record
        selected_reason_required: true
        display: exact_user_selected_pause_reason
      outside_working_hours:
        evidence: current_local_schedule_outside_the_selected_window
        selected_reason_required: false
        display: Outside working hours
      system_inactive:
        evidence: current_system_activity_state_inactive
        selected_reason_required: false
        display: Mac inactive
      system_locked:
        evidence: current_system_lock_state_locked
        selected_reason_required: false
        display: Mac locked
      system_sleeping:
        evidence: current_system_sleep_state_sleeping
        selected_reason_required: false
        display: Mac sleeping
      system_unavailable:
        evidence: current_monotonic_system_unavailable_episode
        selected_reason_required: false
        display: Mac unavailable
      confirmed_away:
        evidence: fresh_qualified_explicit_or_separately_authorized_confirmed_away_record
        selected_reason_required: false
        display: Confirmed away
      accepted_ritual:
        evidence: current_accepted_ritual_that_freezes_the_affected_schedule
        selected_reason_required: false
        display: Break in progress
      intentionally_hidden_system_reason:
        evidence: fresh_system_pause_record_whose_detail_is_intentionally_not_projected
        selected_reason_required: false
        display: none_use_paused_hidden_system_reason
    reason_projection_requires:
      - evidence_kind_registered_in_paused_reason_registry
      - exact_evidence_record_id
      - evidence_record_revision
      - coordinator_generation
      - evidence_currentness_and_reason_specific_freshness_at_recovery_disposition
      - retained_preterminal_evidence_snapshot_digest
      - display_value_exactly_from_the_winning_registry_row
    reason_precedence_smallest_wins:
      manual_pause: 0
      system_locked: 10
      system_inactive: 11
      system_sleeping: 20
      system_unavailable: 21
      accepted_ritual: 30
      confirmed_away: 40
      outside_working_hours: 50
      intentionally_hidden_system_reason: 60
    overlapping_system_trace:
      evidence_input_order_a: [system_unavailable, system_sleeping, system_locked]
      evidence_input_order_b: [system_locked, system_unavailable, system_sleeping]
      bound_winner: system_locked
      display: Mac locked
      rule: both_input_orders_bind_the_same_record_revision_snapshot_and_copy
    prohibited_displays_from_weak_or_ambiguous_evidence:
      - Walk completed
      - Movement completed
      - You took a break
    reason_rule: >-
      Manual Pause alone requires and displays the exact user-selected pause reason. Every system,
      schedule, confirmed-away, or accepted-ritual reason comes from its fresh qualified evidence
      record and never requires a selected reason. An intentionally hidden system reason uses the
      neutral Paused suffix. Held reason separately names its provenance and qualification, such as
      Calendar event, Focus mode, selected app, or qualified inference; stale or missing evidence
      is unknown and never receives confident meeting or deep-focus copy.
  phase_selection_rule: >-
    Read the retained preterminal schedule snapshot after settling any independent component.
    Select body and VoiceOver due/not-due copy from the actual retained schedule threshold. Select
    menu status independently from the full evidence reduction: Paused always remains Paused with
    the registry-qualified or intentionally hidden reason and Held remains Held with its qualified
      evidence reason, whether due or not due. Active due may say Still due; an accumulating or manually opened early ritual
      uses not-due copy and its actual phase. The failed deadline never invents due state.
  interaction:
    initial_focus: close_action
    keyboard: {close: [return, escape, command_period]}
    quiet_transition: close_unusable_ritual_then_60_second_grace_before_normal_reoffer
    menu_rule: show_the_actual_retained_schedule_phase_during_grace_without_a_completion_mark
    failure_rule: fence_or_sync_failure_keeps_the_same_honest_copy_and_adds_retry_when_storage_recovers

input_and_motion:
  decision: D-032
  entrance: instant_final_field_no_global_tint_blur_or_compositor_transition
  countdown_start:
    visual: same_committed_open_action_as_break_started
    movement: only_now_accept_movement_or_merged_movement_accept_with_selected_duration
    recovery: only_now_accept_recovery_with_selected_duration
  break_started_emission:
    visual_or_merged_visual: emitted_atomically_when_the_immediately_running_visual_surface_opens
    movement: not_emitted_when_now_only_opens_movement_offered_emitted_on_5_or_2_minute_acceptance
    merged_movement: emitted_on_5_or_2_minute_acceptance_for_the_second_segment
  movement_acceptance:
    offered_state:
      timer_running: false
      done_early_present: false
      initial_focus: start_5_minutes
      focus_order: [start_5_minutes, start_2_minutes, already_moved, change_position, skip]
      controls_first_frame:
        start_5_minutes: {shortcut: [return, "5"], action: now.accept_movement, duration_seconds: 300}
        start_2_minutes: {shortcut: [q, "2"], action: now.accept_movement, duration_seconds: 120}
        already_moved: {shortcut: [a], action: movement.already_moved}
        change_position: {shortcut: [p], action: movement.position_changed_offered}
        skip: {shortcut: [escape, command_period], action: movement.escape_offered}
      voiceover_value: Movement opportunity. Choose five minutes or two minutes. Timer not started.
    running_state:
      timer_running: true
      selected_duration_required: true
      initial_focus: done_early
      focus_order: [walk_or_wheel, small_space, seated, done_early, already_moved, change_position, skip]
      controls_first_frame:
        walk_or_wheel: {shortcut: ["1"], action: movement.change_content}
        small_space: {shortcut: ["2"], action: movement.change_content}
        seated: {shortcut: ["3"], action: movement.change_content}
        done_early: {shortcut: [return], action: movement.done_early}
        already_moved: {shortcut: [a], action: movement.already_moved}
        change_position: {shortcut: [p], action: movement.position_changed_running}
        skip: {shortcut: [escape, command_period], action: movement.escape_running}
      voiceover_value: Movement opportunity running for the selected duration.
    merged_offered_addition:
      visibility: merged_movement_offered_only
      focus_position: after_change_position_before_skip
      control: {id: just_the_visual_one, accessible_name: Just the visual one, shortcut: [v], action: merged.visual_only}
      first_frame: focusable_keyboard_and_pointer_action_with_no_animation_gate
    merged_rule: replace_movement_action_ids_with_merged_phase_specific_ids_and_keep_other_focus_copy_and_shortcuts
    voiceover_names:
      start_5_minutes: Start five minutes, Return or 5
      start_2_minutes: Start two minutes, Q or 2
      done_early: Done early, Return
      already_moved: I already moved, A
      change_position: Change position instead, P, logged separately
      just_the_visual_one: Just the visual one, V
      skip: Skip, Escape
    escape_rule: immediate_skipped_from_offered_or_running_never_requires_acceptance
  first_active_frame:
    - escape
    - command_period
    - return
    - movement_offered_shortcuts_5_2_q_a_p
    - movement_running_shortcuts_1_2_3_a_p
    - merged_movement_offered_shortcut_v
    - every_pointer_control
  exit: instant_then_restore_previous_application
  declaration_guard_seconds: 0
  rule: >-
    No entrance settlement callback or local animation gate may delay the accepted
    deadline, focus, Escape, Return, or another printed declaration shortcut. Movement
    Done early is absent until a duration acceptance commits `breakStarted`; the offered
    state's 5- and 2-minute controls and exits are first-frame actions instead.

activation:
  current_runtime: legacy_v1
  v2_contract_is_for_following_implementation_stories: true
  forbidden_until_runtime_migration:
    - claiming_new_preset_ids_are_selectable
    - claiming_pause_is_relaunch_durable
    - claiming_cross_device_reconciliation_is_shipped
    - claiming_sensor_schedule_restart_is_shipped
    - claiming_d032_is_fully_implemented

      - derive_the_concrete_product_fact_or_operational_ledgers_clock_effect_snapshot_and_successor_phase
      - commit_or_return_the_concrete_operational_receipt
    rule: >-
      A companion wrapper is transport only and never a transition, resolver member, terminal
      slot, fact kind, or clock effect. Remote merged visual Done early materializes
      merged.visual_segment_done_early and advances to merged_movement_offered when it wins; it
      never closes the parent opportunity. Every terminal or fact-bearing remote action must
      materialize the concrete transition's canonical fact, slot, resolver, and effects.
      companion.take_with_me_request materializes the fact-free handoff. Start 5 and Start 2 are
      the only fact-bearing nonterminal wrappers: each materializes merged.movement_accept, enters
      the signed nonterminal pending/ACK lifecycle, and emits breakStarted exactly once only when
      the coordinator outcome commits merged_movement_running.
  opportunity_phase_graph:
    phases:

        A matching global evidence commit never preserves the old opportunity revision. It
        atomically fences that revision and creates one successor revision. The successor owns
        the exact pre-command phase, segment, accepted monotonic deadline record or suspended
        remaining duration, and retained snapshot without replay, reset, or wall-time extension.
        Paused or Held projection suspends that successor; a later compatible clear resumes the
        same ritual on another successor revision. Every old-revision remote action is rejected.
      reverse_arrival_rule: >-
        A Watch terminal action from the fenced opportunity revision is rejected as expired and
        receives the current projected state even when its callback arrives before the global
        command acknowledgement. It cannot finish, skip, or reset the suspended ritual.

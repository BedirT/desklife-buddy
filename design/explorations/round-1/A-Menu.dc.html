<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #b07a2e; } a:hover { color: #8a5d20; }
    .mi { display: flex; align-items: center; height: 22px; padding: 0 10px 0 22px; font-size: 13px; color: #26241f; position: relative; }
    .mi .sc { margin-left: auto; color: #8f887e; font-size: 13px; padding-left: 24px; }
    .sep { height: 1px; background: #d8d3cb; margin: 5px 10px; }
  </style>
</helmet>
<div style="position: relative; width: 720px; height: 560px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <div style="position: absolute; inset: 0; background: linear-gradient(168deg, #b9ab98 0%, #9d9384 46%, #7f7a6f 100%);"></div>

  <div style="position: absolute; left: 44px; top: 92px; width: 560px; height: 400px; border-radius: 10px; background: #fbfaf8; box-shadow: 0 22px 48px rgba(40,34,26,0.30); overflow: hidden;">
    <div style="height: 34px; background: #f0ede8; border-bottom: 1px solid #e0dbd3; display: flex; align-items: center; padding: 0 12px; gap: 7px;">
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d6d1c9;"></div>
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d6d1c9;"></div>
      <div style="width: 11px; height: 11px; border-radius: 50%; background: #d6d1c9;"></div>
    </div>
    <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 9px;">
      <div style="height: 8px; width: 62%; border-radius: 2px; background: #e6e2db;"></div>
      <div style="height: 8px; width: 84%; border-radius: 2px; background: #ebe7e0;"></div>
      <div style="height: 8px; width: 47%; border-radius: 2px; background: #ebe7e0;"></div>
      <div style="height: 8px; width: 76%; border-radius: 2px; background: #e6e2db;"></div>
      <div style="height: 8px; width: 33%; border-radius: 2px; background: #ebe7e0;"></div>
      <div style="height: 8px; width: 69%; border-radius: 2px; background: #ebe7e0;"></div>
      <div style="height: 8px; width: 55%; border-radius: 2px; background: #e6e2db;"></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 24px; background: rgba(250,249,247,0.72); backdrop-filter: blur(28px); display: flex; align-items: center; padding: 0 12px 0 14px; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 17px;">
      <span style="font-size: 13px; font-weight: 700; color: #26241f; letter-spacing: -0.01em;">Finder</span>
      <span style="font-size: 13px; color: #26241f;">File</span>
      <span style="font-size: 13px; color: #26241f;">Edit</span>
      <span style="font-size: 13px; color: #26241f;">View</span>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 13px;">

      <div style="display: flex; align-items: center; justify-content: center; width: 24px; height: 20px; border-radius: 5px; background: rgba(40,36,30,0.86);">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5" y="5" width="6" height="1.6" rx="0.8" fill="#faf9f7"></rect>
          <rect x="1.5" y="9.4" width="13" height="1.6" rx="0.8" fill="#faf9f7"></rect>
        </svg>
      </div>

      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2a8.6 8.6 0 0 1 12 0M4.4 8.9a5.2 5.2 0 0 1 7.2 0M8 12.2h.01" stroke="#26241f" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>
      <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><rect x="1.4" y="4.4" width="18" height="8.2" rx="2.6" stroke="#26241f" stroke-width="1.2" fill="none"></rect><rect x="3.2" y="6.2" width="12" height="4.6" rx="1.2" fill="#26241f"></rect><path d="M21.2 7.2v2.4" stroke="#26241f" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.2" width="12" height="4" rx="2" stroke="#26241f" stroke-width="1.2" fill="none"></rect><rect x="2" y="8.8" width="12" height="4" rx="2" stroke="#26241f" stroke-width="1.2" fill="none"></rect><circle cx="10.4" cy="5.2" r="1.2" fill="#26241f"></circle><circle cx="5.6" cy="10.8" r="1.2" fill="#26241f"></circle></svg>
      <span style="font-size: 13px; color: #26241f; font-variant-numeric: tabular-nums;">Tue 2:41 PM</span>
    </div>
  </div>

  <div style="position: absolute; top: 27px; right: 116px; width: 292px; border-radius: 10px; background: rgba(250,249,247,0.93); backdrop-filter: blur(42px); border: 0.5px solid rgba(90,82,70,0.22); box-shadow: 0 14px 40px rgba(35,30,22,0.30), 0 1px 2px rgba(35,30,22,0.16); padding: 5px 0; overflow: hidden;">

    <div style="padding: 9px 14px 11px 22px; display: flex; flex-direction: column; gap: 3px;">
      <div style="font-size: 13px; font-weight: 600; color: #26241f; letter-spacing: -0.005em;">Visual reset due</div>
      <div style="font-size: 11px; color: #7d766c; line-height: 1.35;">63 minutes of estimated active computer use</div>
      <div style="font-size: 11px; color: #7d766c; line-height: 1.35;">Movement in about 12 minutes</div>
    </div>

    <div class="sep"></div>
    <div class="mi">Start a visual reset<span class="sc">⌥⌘V</span></div>
    <div class="mi">Start movement
      <span class="sc" style="padding-left: 0;"><svg width="8" height="11" viewBox="0 0 8 11" aria-hidden="true"><path d="M2 1.6 5.6 5.5 2 9.4" stroke="#8f887e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
    </div>

    <div class="sep"></div>
    <div class="mi">Pause
      <span class="sc" style="padding-left: 0;"><svg width="8" height="11" viewBox="0 0 8 11" aria-hidden="true"><path d="M2 1.6 5.6 5.5 2 9.4" stroke="#8f887e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
    </div>
    <div class="mi">
      <span style="position: absolute; left: 7px; display: flex;"><svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><path d="M1.4 5.6 4.2 8.4 9.6 2.4" stroke="#26241f" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      Working hours
    </div>

    <div class="sep"></div>
    <div class="mi">Weekly rhythm…</div>
    <div class="mi">Settings…<span class="sc">⌘,</span></div>

    <div class="sep"></div>
    <div class="mi">Quit Cadence<span class="sc">⌘Q</span></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .kc { display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 30px; padding: 0 6px; border-radius: 4px; border: 1px solid rgba(255,252,246,0.34); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,252,246,0.72); }
    .win { position: absolute; border-radius: 10px; background: #fbfaf8; box-shadow: 0 26px 60px rgba(30,25,18,0.34); overflow: hidden; }
    .wbar { height: 32px; background: #f0ede8; border-bottom: 1px solid #e0dbd3; display: flex; align-items: center; padding: 0 12px; gap: 7px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #d6d1c9; }
    .ln { height: 8px; border-radius: 2px; background: #e8e4dd; }
  </style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- desktop -->
  <div style="position: absolute; inset: 0; background: linear-gradient(163deg, #bcae9a 0%, #9c9384 44%, #7c776c 100%);"></div>

  <div class="win" style="left: 96px; top: 108px; width: 720px; height: 560px;">
    <div class="wbar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 10px;">
      <div class="ln" style="width: 58%;"></div><div class="ln" style="width: 81%;"></div>
      <div class="ln" style="width: 44%;"></div><div class="ln" style="width: 73%;"></div>
      <div class="ln" style="width: 66%;"></div><div class="ln" style="width: 30%;"></div>
      <div class="ln" style="width: 78%;"></div><div class="ln" style="width: 52%;"></div>
    </div>
  </div>

  <div class="win" style="left: 640px; top: 250px; width: 660px; height: 520px;">
    <div class="wbar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 10px;">
      <div class="ln" style="width: 40%; height: 12px;"></div>
      <div class="ln" style="width: 88%;"></div><div class="ln" style="width: 70%;"></div>
      <div class="ln" style="width: 83%;"></div><div class="ln" style="width: 47%;"></div>
      <div class="ln" style="width: 76%;"></div>
    </div>
  </div>

  <!-- dim: the work surface recedes, it is not replaced -->
  <div style="position: absolute; left: 0; top: 24px; right: 0; bottom: 0; background: rgba(26,22,17,0.42);"></div>

  <!-- menu bar stays lit and usable: this is not a lockout -->
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 24px; background: rgba(250,249,247,0.72); backdrop-filter: blur(28px); display: flex; align-items: center; padding: 0 12px 0 14px;">
    <div style="display: flex; align-items: center; gap: 17px;">
      <span style="font-size: 13px; font-weight: 700; color: #26241f; letter-spacing: -0.01em;">Finder</span>
      <span style="font-size: 13px; color: #26241f;">File</span>
      <span style="font-size: 13px; color: #26241f;">Edit</span>
      <span style="font-size: 13px; color: #26241f;">View</span>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 13px;">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="5" y="5" width="6" height="1.6" rx="0.8" fill="#26241f"></rect>
        <rect x="1.5" y="9.4" width="13" height="1.6" rx="0.8" fill="#26241f"></rect>
      </svg>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2a8.6 8.6 0 0 1 12 0M4.4 8.9a5.2 5.2 0 0 1 7.2 0M8 12.2h.01" stroke="#26241f" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>
      <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true"><rect x="1.4" y="4.4" width="18" height="8.2" rx="2.6" stroke="#26241f" stroke-width="1.2" fill="none"></rect><rect x="3.2" y="6.2" width="12" height="4.6" rx="1.2" fill="#26241f"></rect><path d="M21.2 7.2v2.4" stroke="#26241f" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="font-size: 13px; color: #26241f; font-variant-numeric: tabular-nums;">Tue 2:41 PM</span>
    </div>
  </div>

  <!-- the break: type in the space, no container -->
  <div style="position: absolute; left: 148px; top: 330px; width: 820px;">
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif; font-size: 46px; font-weight: 400; line-height: 1.16; letter-spacing: -0.022em; color: rgba(255,252,246,0.97);">
      Look at something comfortably far away.
    </div>
    <div style="margin-top: 20px; font-size: 17px; line-height: 1.5; color: rgba(255,252,246,0.60); max-width: 560px;">
      Let the small details come into view without forcing focus. Blink slowly two or three times.
    </div>

    <!-- coarse, non-numeric progress: no counting, no pulse -->
    <div style="margin-top: 52px; width: 560px; height: 2px; background: rgba(255,252,246,0.18); border-radius: 1px; overflow: hidden;">
      <div style="width: 38%; height: 2px; background: rgba(255,252,246,0.78);"></div>
    </div>
  </div>

  <!-- the exit is never hidden -->
  <div style="position: absolute; left: 148px; bottom: 84px; display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 14px; color: rgba(255,252,246,0.70);">Skip</span>
    <span class="kc">esc</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

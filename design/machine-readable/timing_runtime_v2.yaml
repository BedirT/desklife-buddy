      - system.long_idle_began
      - system.returned_from_long_idle
      - system.sample_gap
      - sensor.strong_movement_restart
      - schedule_restart.undo
    merged_visual_cross_slot_candidate_set:
      - merged.visual_segment_finished
      - merged.visual_segment_done_early
      - merged.escape_during_visual
      - system.timer_recovery_unavailable_merged_visual
    terminal_candidate_set:
      - later.snooze_after_reoffer
      - visual.timer_finished
      - visual.done_early
      - visual.skip
      - visual.escape
      - movement.timer_finished
      - movement.done_early
      - movement.already_moved
      - movement.position_changed_offered
      - movement.position_changed_running
      - movement.skip_offered
      - movement.skip_running
      - movement.escape_offered
      - movement.escape_running
      - position.changed
      - position.skip
      - recovery.timer_finished
      - recovery.done_early
      - recovery.skip_offered
      - recovery.skip_running
      - recovery.escape_offered
      - recovery.escape_running
      - offer.not_appropriate
      - capsule.escape
      - merged.movement_timer_finished
      - merged.movement_done_early
      - merged.movement_already_moved
      - merged.movement_position_changed
      - merged.movement_skip
      - merged.visual_only
      - merged.escape_during_movement
    operational_terminal_disposition:
      - system.timer_recovery_unavailable
  companion_action_normalization:
    registry_closed: true
    envelope_requires:
      - remote_action_id
      - exact_concrete_payload
      - causal_origin_envelope
      - global_state_id_and_coordinator_generation
      - opportunity_id_revision_projection_epoch_phase_and_segment
      - live_projection_lease
    remote_to_concrete_transition:
      companion.visual.done_early: visual.done_early
      companion.visual.skip: visual.skip
      companion.visual.escape: visual.escape
      companion.movement.done_early: movement.done_early
      companion.movement.already_moved: movement.already_moved
      companion.movement.position_changed_offered: movement.position_changed_offered
      companion.movement.position_changed_running: movement.position_changed_running
      companion.movement.skip_offered: movement.skip_offered
      companion.movement.skip_running: movement.skip_running
      companion.movement.escape_offered: movement.escape_offered
      companion.movement.escape_running: movement.escape_running
      companion.position.changed: position.changed
      companion.position.skip: position.skip
      companion.recovery.done_early: recovery.done_early
      companion.recovery.skip_offered: recovery.skip_offered
      companion.recovery.skip_running: recovery.skip_running
      companion.recovery.escape_offered: recovery.escape_offered
      companion.recovery.escape_running: recovery.escape_running
      companion.merged.visual_done_early: merged.visual_segment_done_early
      companion.merged.movement_done_early: merged.movement_done_early
      companion.merged.movement_already_moved: merged.movement_already_moved
      companion.merged.movement_position_changed: merged.movement_position_changed
      companion.merged.movement_skip: merged.movement_skip
      companion.merged.visual_only: merged.visual_only
      companion.merged.escape_during_visual: merged.escape_during_visual
      companion.merged.escape_during_movement: merged.escape_during_movement
    materialization_order:
      - reject_any_unregistered_remote_action_id
      - replace_wrapper_with_the_exact_registered_concrete_transition_id_and_payload
      - validate_concrete_phase_participants_affected_nonparticipants_segment_slot_and_required_payload
      - select_the_concrete_transitions_named_resolver
      - derive_the_concrete_product_fact_clock_effect_snapshot_and_successor_phase
      - commit_or_return_the_concrete_operational_receipt
    rule: >-
      A companion wrapper is transport only and never a transition, resolver member, terminal
      slot, fact kind, or clock effect. Remote merged visual Done early materializes
      merged.visual_segment_done_early and advances to merged_movement_offered when it wins; it
      never closes the parent opportunity. Every registered remote action must materialize a
      concrete transition with a nonempty canonical product-fact projection.
  opportunity_phase_graph:
    phases:
      - coordinated
      - heads_up
      - visual_offered
      - visual_running
      - movement_offered
      - movement_running
      - position_offered
      - recovery_offered
      - recovery_running
      - merged_visual_offered
      - merged_visual_running
      - merged_movement_offered
      - merged_movement_running
      - held
      - paused
      - snoozed
      - release_corridor
      - terminal_provisional
      - closed
    edges:
      coordinated: [heads_up, visual_offered, movement_offered, position_offered, recovery_offered, merged_visual_offered, held, paused]
      heads_up: [visual_offered, movement_offered, position_offered, recovery_offered, merged_visual_offered, visual_running, merged_visual_running, held, paused, snoozed, terminal_provisional]
      visual_offered: [visual_running, held, paused, snoozed, terminal_provisional]
      visual_running: [terminal_provisional]
      movement_offered: [movement_running, held, paused, snoozed, terminal_provisional]
      movement_running: [terminal_provisional]
      position_offered: [held, paused, snoozed, terminal_provisional]
      recovery_offered: [recovery_running, held, paused, snoozed, terminal_provisional]
      recovery_running: [terminal_provisional]
      merged_visual_offered: [merged_visual_running, held, paused, snoozed, terminal_provisional]
      merged_visual_running: [merged_movement_offered, terminal_provisional]
      merged_movement_offered: [merged_movement_running, held, paused, terminal_provisional]
      merged_movement_running: [terminal_provisional]
      held: [release_corridor, paused, terminal_provisional]
      paused: [release_corridor, terminal_provisional]
      snoozed: [release_corridor, held, paused, terminal_provisional]
      release_corridor: [visual_offered, movement_offered, position_offered, recovery_offered, merged_visual_offered, held, paused, terminal_provisional]
      terminal_provisional: [closed]
      closed: []
    terminal_slots:
      standalone: opportunity_close
      merged_visual_segment: visual_segment
      merged_opportunity: opportunity_close
    rule: >-
      A transition must use its registered source phase, opportunity kind, base participant
      set, segment, affected-nonparticipant references, and required payload. Paused/Held
      evidence is orthogonal to running phases. A phase reached only because of a
      provisional candidate is replayed if that candidate later loses reconciliation.
  nonterminal_reconciliation:
    rule: >-
      Effect-bearing nonterminal actions never form a distributed callback race. The
      authoritative coordinator validates one causal frontier, partitions eligible commands by
      conflict key, selects one winner per key, and applies every mutually compatible key winner
      in canonical key order within one transaction. Only commands that address the same evidence
      record or mutually exclusive opportunity intent compete. Arrival order is never an input.
      The transaction then reduces the complete Paused/Held evidence set and acknowledges one
      successor global revision plus any atomically fenced opportunity revision.
    conflict_key_reduction:
      key_encoding: cadence_contract_bytes_v1_of_registered_key_kind_and_normalized_identity_fields
      same_key_winner_sort:
        - causally_satisfied_exact_scope_revision
        - smallest_transition_rank_within_conflict_key
        - lexicographically_smallest_action_id
      disjoint_key_apply_order: canonical_conflict_key_bytes_unsigned_lexicographic
      apply_rule: apply_one_winner_for_every_compatible_disjoint_key_then_reduce_full_evidence_once
      incompatible_rule: opportunity_phase_or_terminal_fence_incompatibility_requires_revalidation_at_the_successor_revision
      revalidation_rule: >-
        After the atomic frontier commits, queued commands re-read the new global revision,
        complete evidence set, and any opportunity fence. A command whose named evidence record
        is still current may enter the next frontier; stale opportunity or record identities get
        a truthful current-state receipt.
      registered_conflict_key_by_transition:
        pause.start: manual_pause_record_by_pause_revision
        pause.resume: manual_pause_record_by_matching_pause_revision
        hold.begin: hold_evidence_record_by_decision_id
        hold.release: hold_evidence_record_by_matching_decision_id
        hold.correction_release: hold_evidence_record_by_matching_decision_id
        working_hours.exit: working_hours_evidence_record
        working_hours.enter: working_hours_evidence_record
        system.unavailable: system_unavailable_record_by_episode_id
        system.available: system_unavailable_record_by_matching_episode_id
        system.available_after_extended_unavailable: system_unavailable_record_by_matching_episode_id
        system.short_input_idle: short_input_idle_record_by_sample_sequence
        system.long_idle_began: long_idle_record_by_idle_episode_id
        system.returned_from_long_idle: long_idle_record_by_matching_idle_episode_id
        system.sample_gap: sample_gap_record_by_sample_sequence
        sensor.strong_movement_restart: schedule_restart_record_by_decision_id
        schedule_restart.undo: schedule_restart_record_by_matching_decision_id
        opportunity.presented: opportunity_phase_intent_by_opportunity_id
        merge.created: opportunity_phase_intent_by_opportunity_id
        delivery.shift_to_seam: opportunity_delivery_intent_by_opportunity_id
        now.accept_visual: opportunity_phase_intent_by_opportunity_id
        now.open_movement_offer: opportunity_phase_intent_by_opportunity_id
        now.accept_movement: opportunity_phase_intent_by_opportunity_id
        later.snooze: opportunity_phase_intent_by_opportunity_id
        movement.change_content: opportunity_content_intent_by_opportunity_id_and_segment
        now.accept_recovery: opportunity_phase_intent_by_opportunity_id
        merged.accept: opportunity_phase_intent_by_opportunity_id
        merged.movement_accept: opportunity_phase_intent_by_opportunity_id
        merged.movement_change_content: opportunity_content_intent_by_opportunity_id_and_segment
        companion.take_with_me: opportunity_handoff_intent_by_opportunity_id
      exact_300_collision_trace:
        frontier_inputs:
          - system.unavailable_with_episode_lock_1
          - system.long_idle_began_with_idle_episode_idle_1_and_elapsed_exactly_300
        conflict_keys: [system_unavailable_record_lock_1, long_idle_record_idle_1]
        committed_winners: [system.unavailable, system.long_idle_began]
        result: both_evidence_records_are_set_likelyNaturalInterruption_is_recorded_once_and_all_clocks_freeze
      release_composition_trace:
        frontier_inputs: [pause.resume_for_pause_1, system.available_for_lock_1]
        conflict_keys: [manual_pause_record_pause_1, system_unavailable_record_lock_1]
        committed_winners: [pause.resume, system.available]
        result: both_named_records_clear_then_remaining_evidence_projects_paused_held_running_or_corridor
    transition_rank_within_conflict_key_smallest_wins:
      pause.start: 0
      system.unavailable: 5
      working_hours.exit: 10
      system.long_idle_began: 15
      hold.begin: 20
      later.snooze: 25
      companion.take_with_me: 30
      sensor.strong_movement_restart: 35
      schedule_restart.undo: 36
      pause.resume: 40
      system.available_after_extended_unavailable: 41
      system.available: 42
      working_hours.enter: 43
      system.returned_from_long_idle: 44
      hold.correction_release: 45
      hold.release: 46
      system.sample_gap: 50
      system.short_input_idle: 51
      merge.created: 55
      now.accept_visual: 60
      now.open_movement_offer: 61
      now.accept_movement: 62
      merged.accept: 63
      merged.movement_accept: 64
      now.accept_recovery: 65
      movement.change_content: 70
      merged.movement_change_content: 71
      delivery.shift_to_seam: 80
      opportunity.presented: 90
    order_coverage_rule: >-
      Conflict-key registry and rank keys each equal exactly the union of authoritative
      opportunity and authoritative global nonterminal resolver membership. Rank then ActionID
      totally orders only commands sharing one key. Compatible winners from every disjoint key
      commit; a command acknowledged at the successor revision must revalidate.
    global_state_rule: >-
      A global action uses the single authoritative coordinator state revision. Pause and
      hold state is reduced from the complete fresh evidence set using collision_precedence after
      all disjoint evidence winners apply. Before an opportunity command commits, that same
      coordinator revision and any optional running-opportunity compare-and-fence context are
      checked atomically. Clears name only the evidence record or pause revision they remove.
      System samples are reduced by coordinator epoch and monotonic sample sequence, not callback
      arrival. A lock cannot discard a simultaneous long-idle edge, and one clear cannot discard
      another disjoint clear.
  merged_visual_cross_slot_arbiter:
    coverage_selector: >-
      Derive every concrete transition whose guard explicitly includes merged_visual_running and
      whose target exits that phase or closes its parent. Companion wrappers are normalized first;
      unchanged handoff actions are excluded. The derived set must exactly equal resolver membership.
    requires_same_origin:
      - opportunity_id
      - coordinator_generation
      - opportunity_revision
      - visual_segment_id
    winner_rank_smallest_wins:
      merged.escape_during_visual: 0
      merged.visual_segment_done_early: 10
      system.timer_recovery_unavailable_merged_visual: 15
      merged.visual_segment_finished: 20
    winner_sort_key:
      - smallest_cross_slot_rank
      - lexicographically_smallest_action_id
    loser_effect: operational_rejected_no_op_no_fact_no_clock_effect
    component_finality: >-
      The visual component becomes final only when this arbiter commits and acknowledges its
      winning component transition. A same-origin parent Escape that wins preempts the visual
      component: emit only skipped for the merged opportunity and create no timerFinished,
      userDeclaredCompleted, visual fresh cycle, or movement offer from the losing component.
      If operational timer recovery wins, emit no product fact or fresh cycle, preserve both due
      schedules, fence the parent projection, and show the conditional recovery projection.
    already_committed_component_rule: >-
      Once a component winner is committed at the successor revision, visual finality and its
      one fresh-cycle effect are immutable. A later Escape is guarded as
      merged.escape_during_movement and retains the already-fresh visual component.
    convergence: >-
      The derived transitions cannot project independently from one revision. The authoritative
      coordinator admits them into this one causal reduction, commits exactly one winner and
      successor revision, and returns an explicit rejected-no-op receipt for every loser. Thus
      no same-revision race can create both timerFinished and skipped or apply visual succession
      twice. A local or normalized remote action has the same rank and effect. Arrival time and
      wall time are not inputs.
  clock_effect_definitions:
    accrue: add_only_the_current_valid_sample_interval
    freeze: add_zero_while_the_named_state_or_ritual_is_active
    retain: preserve_accumulated_time_cycle_identity_and_due_state_then_apply_normal_eligibility
    resume: establish_a_new_monotonic_baseline_add_zero_then_apply_normal_eligibility
    fresh_cycle: replace_cycle_id_zero_accumulated_time_and_create_no_completion_fact_by_itself
    rotate_position_cycle_preserving_enablement: replace_latent_position_cycle_id_zero_accumulated_time_and_leave_reminder_enablement_unchanged
    restore_pre_ritual: restore_the_exact_snapshot_taken_before_this_ritual_without_offline_catch_up
    preserve_current_eligibility: leave_each_clock_in_its_existing_frozen_or_eligible_rule
    project_full_evidence_eligibility: reduce_all_evidence_then_freeze_continue_or_resume_each_clock_as_that_state_requires
    deferral_increment: increment_recovery_deferral_load_once_without_changing_another_clock
    fresh_if_screen_away_basis: fresh_cycle_only_with_explicit_or_strong_fresh_screen_away_basis_otherwise_retain
    fresh_if_carried: fresh_cycle_only_when_this_clock_cycle_is_carried_by_the_opportunity_otherwise_retain
    fresh_if_carried_else_deferral_if_movement_carried: fresh_cycle_when_recovery_is_carried_else_increment_once_when_movement_is_carried_else_retain
    continue_eligibility: keep_cycle_and_due_state_while_adding_only_normally_eligible_sample_time
    restore_decision_snapshot: restore_every_affected_cycle_id_time_phase_and_recovery_value_from_the_named_decision
    unchanged: make_no_immediate_clock_mutation
  late_and_invalid_action_rule: >-
    Unknown identity, mismatched participants, unsupported source phase, invalid payload,
    or an action originated after its actor had observed the terminal revision is an
    operational rejected no-op with an ephemeral user-visible receipt. A terminal candidate
    that originated from an allowed phase/revision before provisional closure remains eligible
    only while its exact coordinator generation and projection epoch are live and unfenced.
    Arrival after a generation or projection fence is rejected regardless of pre-reboot origin;
    causal metadata, registered guards, and the persisted fence decide validity.
  transitions:
    - id: opportunity.presented
      terminal: false
      facts: [promptPresented]
      ledgers: [product_fact]
      clocks: {visual: continue_eligibility, movement: continue_eligibility, position: continue_eligibility, recovery: continue_eligibility}
      visible: one_heads_up_projection_for_the_opportunity
      stale: no_op
      recovery: same_opportunity_id_for_every_projection_and_response
    - id: merge.created
      terminal: false
      facts: []
      ledgers: [scheduling_decision]
      clocks: {visual: retain, movement: retain, position: retain, recovery: retain}
      visible: one_opportunity_carries_each_participating_cycle_id
      stale: no_op
      recovery: unmerge_before_acceptance_restores_the_same_independent_cycles
    - id: delivery.shift_to_seam
      terminal: false
      facts: []
      ledgers: [scheduling_decision]
      clocks: {visual: continue_eligibility, movement: continue_eligibility, position: continue_eligibility, recovery: continue_eligibility}
      visible: no_interruption_until_bounded_selected_seam
      stale: no_op
      recovery: latest_preferred_boundary_still_applies_unless_a_hold_is_active
    - id: now.accept_visual
      terminal: false
      facts: [breakStarted]
      ledgers: [product_fact]
      clocks: {visual: freeze, movement: continue_eligibility, position: freeze, recovery: continue_eligibility}
      visible: visual_running_from_first_active_frame
      stale: no_op
      recovery: absolute_deadline_reopens_or_finishes_once
    - id: now.open_movement_offer
      terminal: false
      facts: []
      ledgers: [operational]
      clocks: {visual: continue_eligibility, movement: continue_eligibility, position: continue_eligibility, recovery: continue_eligibility}
      visible: movement_offered_timer_not_started
      stale: no_op
      recovery: same_opportunity_revision_advances_without_breakStarted_or_deadline
    - id: now.accept_movement
      terminal: false
      facts: [breakStarted]
      ledgers: [product_fact]
      clocks: {visual: freeze, movement: freeze, position: freeze, recovery: freeze}
      visible: selected_300_or_120_second_movement_running_from_acceptance_frame
      stale: no_op
      recovery: absolute_deadline_reopens_or_finishes_once
    - id: later.snooze
      terminal: false
